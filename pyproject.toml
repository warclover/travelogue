[project]
name = "travelogue"
version = "0.1.0"
description = "Local travel memory magazine editor — photos to HTML travelogue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "pybars3>=0.9.7",
  "typer>=0.12",
  "pillow>=10.0",
  # curate→cohort_faces→face_embed imports numpy in the base pipeline.
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "piexif>=1.1", "playwright>=1.40", "ruff>=0.8", "import-linter>=2.13"]
desktop = ["comtypes>=1.4", "pyinstaller>=6.6"]
playwright = ["playwright>=1.40"]
heif = ["pillow-heif>=0.16"]
vision = ["opencv-python-headless>=4.8.0", "numpy>=1.24", "scikit-learn>=1.3"]
clip = ["torch>=2.0", "open-clip-torch>=2.24"]
cull-ml = ["torch>=2.0", "torchvision>=0.15", "pyiqa>=0.1.10"]

[project.scripts]
travelogue = "travelogue.cli:main"
travelogue-studio = "travelogue.desktop.launcher:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travelogue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "vision: optional CLIP/torch integration tests",
    "playwright_serial: Playwright capture tests; run serially to avoid open_clip/torch contention",
    "unit: pure logic; no HTTP server or full ingest/curate/render pipeline",
    "integration: partial pipeline or module boundaries; may take seconds",
    "e2e: HTTP server and/or full studio pipeline end-to-end",
    "legacy_homepage: classic freeze emergency page smoke (GET /classic)",
    "mosaic: planner tests that require mosaic.enabled (Phase 15 MCS)",
    "controlled_parity: P17 LSE controlled-environment screens parity (AC-P17-01)",
    "w3a_gate: P17 W3a cut-engine gates (AC-P17-23/27/31)",
    "pt_windows_spawn: Pipeline Throughput ProcessPool spawn smoke (nightly Windows / G1 gate)",
    "pipeline_isolation: dual-pipeline isolation contract (DPI); local one-shot selector for humans and triage — NOT a separate CI step (already inside the fast suite)",
]
# Fast local / PR subset (matches .github/workflows/ci.yml test-pr):
#   pytest --fast -q
# Equivalent explicit filter:
#   pytest -m "not integration and not e2e and not vision and not playwright_serial and not legacy_homepage" -q

[tool.coverage.run]
source = ["travelogue"]
omit = ["travelogue/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# Public re-exports; F401 is intentional.
"travelogue/curation/screen_planner.py" = ["F401"]
"travelogue/curation/layout_search.py" = ["F401"]
# Star-import shim wrappers (F405 on usage of re-exported names).
"travelogue/curation/chapter_items.py" = ["F405"]
# One-shot migration/split scripts; style noise is not worth blocking CI.
"scripts/check_usage_consistency.py" = ["E741"]
"scripts/split_preview_toolbar_*.py" = ["F841", "E731"]
"scripts/archive/**" = ["F841", "E731"]
"travelogue/web/studio_dispatch.py" = ["E731"]
# Upstream vendored collage — do not restyle Optional.
"travelogue/export/_vendor/**" = ["UP"]
# Bag-of-mix keys use L/P/S letters; `l` is landscape count (TPC).
"travelogue/layout_engine/contract/mix_index.py" = ["E741"]

[tool.importlinter]
root_package = "travelogue"

[[tool.importlinter.contracts]]
name = "Architectural layers (PRD §5.3.1 · M-B0 baseline)"
type = "layers"
unmatched_ignore_imports_alerting = "none"
# Top → bottom (import-linter: higher entries may import lower only).
layers = [
    "travelogue.cli : travelogue.web : travelogue.desktop",
    "travelogue.orchestrator",
    "travelogue.render : travelogue.export",
    "travelogue.services : travelogue.templating",
    # ACP D-ACP-01a · cover_engine co-layer with curation (imports curate_scoring/food_policy)
    "travelogue.curation : travelogue.layout_engine : travelogue.layout_templates : travelogue.cover_engine",
    "travelogue.media : travelogue.vision : travelogue.llm : travelogue.ai",
    "travelogue.config",
    "travelogue.util : travelogue.types : travelogue.layout_contract : travelogue.constants : travelogue.paths : travelogue.manifest_limits : travelogue.errors : travelogue.domain",
]
# Targeted CI debt only; keep this list mirrored in test_arch_opt_gates.py.
ignore_imports = [
    # master CI debt · ingest finalize hooks pending P2
    "travelogue.media.ingest -> travelogue.curation.aesthetic_score",
    # master CI debt · ingest finalize hooks pending P2
    "travelogue.media.ingest -> travelogue.curation.photo_cull",
    # master CI debt · ingest finalize hooks pending P2
    "travelogue.media.ingest -> travelogue.curation.algorithm_profile",
    # master CI debt · aesthetic warm-on-ingest pending P2
    "travelogue.media.ingest -> travelogue.curation.aesthetic_warm",
    # master CI debt · parallel worker aesthetic signals pending P2
    "travelogue.media.ingest_worker -> travelogue.curation.aesthetic_score",
    # master CI debt · parallel aesthetic finalize pending P2
    "travelogue.media.ingest_parallel -> travelogue.curation.aesthetic_score",
    # ACP W1b · cover_engine in layers (D-ACP-01a); title_art still reads render helpers (pending extract to domain)
    "travelogue.cover_engine.title_art.engine -> travelogue.render.context",
    # ACP W1b · cover_engine in layers (D-ACP-01a); title_art still reads render helpers (pending extract to domain)
    "travelogue.cover_engine.title_art.engine -> travelogue.render.cover_opening",
]

[[tool.importlinter.contracts]]
name = "Parallel ingest worker isolation (AC-PT-11)"
type = "forbidden"
source_modules = [
    "travelogue.media.ingest_worker",
]
forbidden_modules = [
    "travelogue.media.geocode",
    "travelogue.services",
    "travelogue.web",
    "travelogue.orchestrator",
    "travelogue.curation",
    "travelogue.vision",
]
ignore_imports = [
    # Worker may compute aesthetic signals inline; full extraction pending P2.
    "travelogue.media.ingest_worker -> travelogue.curation.aesthetic_score",
]

[[tool.importlinter.contracts]]
name = "AI capability layer must not import upward (ACP D-ACP-01)"
type = "forbidden"
source_modules = ["travelogue.ai"]
forbidden_modules = [
    "travelogue.curation",
    "travelogue.layout_engine",
    "travelogue.layout_templates",
    "travelogue.cover_engine",
    "travelogue.services",
    "travelogue.render",
    "travelogue.export",
    "travelogue.web",
    "travelogue.orchestrator",
    "travelogue.cli",
    "travelogue.desktop",
]

[[tool.importlinter.contracts]]
name = "PFM editorial_series isolation (D-U-15 / ISO-05)"
type = "forbidden"
# Direct only: curate → editorial_series is the designed fork.
# layout_templates already reaches curate via algorithm_profile.
allow_indirect_imports = true
source_modules = [
    "travelogue.layout_engine.mosaic",
    "travelogue.layout_templates",
]
forbidden_modules = [
    "travelogue.layout_engine.editorial_series",
]

[[tool.importlinter.contracts]]
name = "DPI journal render isolation"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "travelogue.render.journal_chapters",
]
forbidden_modules = [
    "travelogue.layout_engine.editorial_series",
    "travelogue.export.portfolio_pages",
    "travelogue.export.portfolio_wechat",
]

[[tool.importlinter.contracts]]
name = "DPI portfolio render isolation"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "travelogue.render.portfolio_chapters",
]
forbidden_modules = [
    "travelogue.layout_engine.mosaic",
    "travelogue.curation.longshot_filter",
    "travelogue.curation.moment_scoring",
]
