[project]
name = "travelogue"
version = "0.1.0"
description = "Local travel memory magazine editor — photos to HTML travelogue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "pybars3>=0.9.7",
  "typer>=0.12",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "piexif>=1.1", "playwright>=1.40"]
desktop = ["comtypes>=1.4", "pyinstaller>=6.6"]
playwright = ["playwright>=1.40"]
heif = ["pillow-heif>=0.16"]
vision = ["opencv-python-headless>=4.8.0"]

[project.scripts]
travelogue = "travelogue.cli:main"
travelogue-studio = "travelogue.desktop.launcher:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travelogue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
