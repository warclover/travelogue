[project]
name = "travelogue"
version = "0.1.0"
description = "Local travel memory magazine editor — photos to HTML travelogue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  "pybars3>=0.9.7",
  "typer>=0.12",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "piexif>=1.1", "playwright>=1.40", "ruff>=0.8"]
desktop = ["comtypes>=1.4", "pyinstaller>=6.6"]
playwright = ["playwright>=1.40"]
heif = ["pillow-heif>=0.16"]
vision = ["opencv-python-headless>=4.8.0", "numpy>=1.24", "scikit-learn>=1.3"]
clip = ["torch>=2.0", "open-clip-torch>=2.24"]
cull-ml = ["torch>=2.0", "torchvision>=0.15", "pyiqa>=0.1.10"]

[project.scripts]
travelogue = "travelogue.cli:main"
travelogue-studio = "travelogue.desktop.launcher:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["travelogue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "vision: optional CLIP/torch integration tests",
    "playwright_serial: Playwright capture tests; run serially to avoid open_clip/torch contention",
    "unit: pure logic; no HTTP server or full ingest/curate/render pipeline",
    "integration: partial pipeline or module boundaries; may take seconds",
    "e2e: HTTP server and/or full studio pipeline end-to-end",
    "legacy_homepage: classic freeze emergency page smoke (GET /classic)",
    "mosaic: planner tests that require mosaic.enabled (Phase 15 MCS)",
]
# Fast local / PR subset (matches .github/workflows/ci.yml test-pr):
#   pytest --fast -q
# Equivalent explicit filter:
#   pytest -m "not integration and not e2e and not vision and not playwright_serial and not legacy_homepage" -q

[tool.coverage.run]
source = ["travelogue"]
omit = ["travelogue/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# Public re-exports; F401 is intentional.
"travelogue/curation/screen_planner.py" = ["F401"]
"travelogue/curation/layout_search.py" = ["F401"]
