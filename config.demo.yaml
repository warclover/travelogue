# Demo 专用配置（更快导入，适合本地演示）
# 使用：travelogue demo ./album --config config.demo.yaml
# 若未指定 --config 且项目根存在本文件，demo 会自动加载

trips_dir: ./trips

ingest:
  max_photos: 250
  webp_widths: [800, 1600]
  webp_quality: 82
  generate_crops: false
  min_edge_px: 320
  phash_threshold: 10
  burst_seconds: 3.0
  dedupe_phash: true
  dedupe_burst: true
  min_long_edge_layout_px: 800
  min_short_edge_layout_px: 600
  low_res_median_ratio: 0.55
  low_res_peak_ratio: 0.42
  detect_faces: true
  face_min_size_px: 48

vision:
  enabled: true

cull:
  enabled: true
  mode: rules
  keep_ratio_floor: 0.90
  min_keep: 15
  featured_exempt: true
  max_photos_warn_only: true
  # Phase 9.2 推荐参数（基于当前 acceptance baseline）
  bucketed_blur_thresholds: false
  bucketed_blur_min_samples: 3
  enable_cull_explain: true
  score:
    duplicate_group_penalty: 0.08

curate:
  # Phase 10 · food grid（默认开启，可一键关闭回退）
  enable_food_grid: true
  # Phase 10.1 · 默认仍只启用 food 桶
  mundane_grid_buckets: [food]
