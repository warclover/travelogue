# Hobbyist-friendly CI budget:
# - PR: lint + test-pr (unit/fast only, Python 3.11)
# - push to master/main: full gate (integration + e2e + validate)
# test-pr skips playwright_serial / e2e markers for speed.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    paths-ignore:
      # Keep acceptance-records JSON in CI (IMPLEMENTATION §8.1); ignore prose/docs only.
      - "**.md"
      - "docs/**/*.md"
      - "docs/wireframes/**"
      - "docs/adr/**"
      - "docs/reports/**"
      - "docs/templates/**"
      - ".cursor/**"

# Cancel superseded runs on the same ref (saves minutes on force-push / rapid commits).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff (travelogue + tests + scripts)
        run: |
          python -m ruff check travelogue tests scripts

      - name: Trip save lint
        run: python scripts/lint_trip_save_calls.py

      - name: No runtime assert in travelogue (ASH)
        run: python scripts/lint_no_runtime_assert.py

      - name: Trip pipeline mutation lint (M-C4)
        run: python scripts/lint_trip_pipeline_mutations.py

      - name: Test layout lint (M-C2)
        run: python scripts/lint_test_layout.py

      - name: Trip JSON lint (ADR-008)
        run: python scripts/lint_trip_json.py schemas/fixtures tests/fixtures

      - name: Trip HTML title consistency (shelf/preview drift)
        run: python scripts/lint_trip_html_title.py schemas/fixtures tests/fixtures

      - name: Binary asset signatures (new drift only; B-03 abandoned set allowlisted)
        run: python scripts/lint_binary_assets.py --strict

      - name: Import layer contract (M-B0)
        run: lint-imports

      - name: LSE cross-import ceiling (ADR-015)
        run: python scripts/lint_lse_cross_import.py

      - name: LSE ratchet anti-tamper + growth-log (Arch Opt V2 · AC2-05)
        run: python scripts/lint_ratchet_growth_log.py

      - name: layout_contract surface (P2-C)
        run: python scripts/lint_layout_contract_surface.py

      - name: GPL license scan (AC-TPC-07 / AC-GCS-09)
        run: python scripts/license_gpl_scan.py

      - name: Pipeline Throughput default flags lint (M5)
        run: python scripts/lint_pt_default_flags.py

      - name: Pipeline Throughput gate schema (M5)
        run: python scripts/pipeline_throughput_gate.py --from-record --require-schema-only

      - name: Pipeline Throughput check-default-on (M5 · block accelerated defaults without signoff)
        run: python scripts/pipeline_throughput_gate.py --check-default-on

      # CSC · Completion Surface Convergence ratchets (AC-CSC-01/02/03/12)
      - name: CSC layout_engine facade deep-import ceiling
        run: python scripts/lint_layout_engine_facade.py

      - name: DPI dual-pipeline ownership ratchet
        run: python scripts/lint_dual_pipeline_ownership.py

      - name: RCL orchestrator length + comment-budget ratchet
        run: python scripts/lint_rcl_orchestrators.py

      - name: RCL frontend live-path closure
        run: python scripts/lint_frontend_live_path.py

      - name: CSC god-module line ceiling (curate / studio_pipeline)
        run: python scripts/lint_csc_god_module_ratchet.py

      - name: CSC shim/legacy debt table ceiling
        run: python scripts/lint_csc_debt_table.py

      - name: CSC Happy Path Recipe baseline (no silent default-True growth)
        run: python scripts/lint_csc_recipe_baseline.py

      # QFX · 聚合窄门禁（AC-QFX-24）；CSC recipe/god/facade 已在上方亦含于 gate
      - name: QFX quality_fixpack_gate
        run: python scripts/quality_fixpack_gate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Preview toolbar tsc (M-C5)
        run: |
          npm ci
          npm run tsc:preview-toolbar

      # CQA · 周审计修复包窄门禁（AC-CQA-22/23；需 Node 跑 FE 契约）
      - name: CQA god-module ratchet (hook / longshot)
        run: python scripts/lint_cqa_god_module_ratchet.py

      - name: CQA code_quality_audit_fixpack_gate
        run: python scripts/code_quality_audit_fixpack_gate.py

  test-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # SFH W0a · Studio FE Node 单测（与 lint 同 Node 主版本；fail-closed，禁止无 node skip）
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Studio FE JS unit tests (SFH)
        run: npm run test:js

      - name: Install package
        run: |
          pip install -e ".[dev]"
          # Clustering unit tests need sklearn; avoid full [vision] (opencv) on PR runners.
          pip install "scikit-learn>=1.3"

      - name: Pytest (PR fast · unit + unmarked)
        run: |
          python -m pytest tests/ -q \
            -m "not integration and not e2e and not vision and not playwright_serial and not legacy_homepage" \
            --cov=travelogue.web.studio_handlers \
            --cov=travelogue.web.studio_handlers.import_handlers \
            --cov=travelogue.web.studio_handlers.export_handlers \
            --cov=travelogue.web.studio_subprocess \
            --cov=travelogue.services.trip \
            --cov=travelogue.layout_engine.mosaic \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=65

      # LTN R-A1 · LRG sync-journal must block PRs (was push-only / dead PR-warn in validate).
      - name: LTE journal CSS sync drift (PR block)
        run: |
          python -m travelogue.layout_templates.cli export --sync-journal
          git diff --exit-code templates/visual-journal/journal-screens.css || {
            echo "journal-screens.css out of sync; run: python -m travelogue.layout_templates.cli export --sync-journal"
            exit 1
          }
          python -m travelogue.layout_templates.cli export --sync-portfolio
          git diff --exit-code templates/visual-journal/portfolio-pages.css || {
            echo "portfolio-pages.css out of sync; run: python -m travelogue.layout_templates.cli export --sync-portfolio"
            exit 1
          }

      # LTN R-A5 / H8 · active mosaic set must agree across policy / codegen / schema.
      - name: LTN active_set_gate
        run: python scripts/ltn_active_set_gate.py

      # LTN H7 · declared main AR must match rendered cell AR on active templates.
      - name: LTN geometry audit
        run: python scripts/ltn_geometry_audit.py

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Heavy jobs: only on push to main/master (after merge), not on every PR push.
  test-integration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          pip install -e ".[dev]"
          pip install "scikit-learn>=1.3"

      - name: Pytest (integration pipeline)
        run: |
          python -m pytest tests/ -q \
            -m "integration and not e2e and not vision and not playwright_serial and not legacy_homepage"

      - name: Pipeline Throughput integration (test_pt_*)
        run: |
          python -m pytest tests/integration/test_pt_*.py -q --tb=short

      - name: Phase 4 acceptance gate (integration)
        run: python scripts/phase4_acceptance_gate.py

  test-e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + Playwright
        run: |
          pip install -e ".[dev,playwright]"
          playwright install chromium

      - name: Pytest (e2e + browser)
        run: python -m pytest tests/ -q -m "(e2e or playwright_serial) and not legacy_homepage"

  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev,playwright]"

      - name: Validate fixtures
        run: |
          python scripts/validate_trip.py schemas/fixtures/trip.example.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.ingest_ready.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.structure_locked.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.copy_locked.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.render_golden.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.linzhi_screens.json --level all
          python scripts/lint_trip_json.py schemas/fixtures tests/fixtures

      - name: Architecture equivalence self-check (M-B0 · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/arch_equivalence_check.py

      - name: Architecture equivalence self-check (M-B0 · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/arch_equivalence_check.py

      - name: Pipeline Perf E-A equivalence (AC-PPF-07a · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/pipeline_perf_equivalence_check.py

      - name: Pipeline Perf E-A equivalence (AC-PPF-07a · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/pipeline_perf_equivalence_check.py

      - name: Pipeline Throughput gate from-record schema (M5 · block)
        run: python scripts/pipeline_throughput_gate.py --from-record --require-schema-only

      - name: Pipeline Throughput gate from-record strict (M5 · warn until AC filled)
        continue-on-error: true
        run: python scripts/pipeline_throughput_gate.py --from-record --strict

      - name: Demo verify (fixtures + DOM)
        run: |
          python -c "from travelogue.demo.verify import run_demo_verify; import sys; r=run_demo_verify(skip_pytest=True); print('\n'.join(r.messages)); sys.exit(0 if r.ok else 1)"

      - name: Phase9 eval baseline drift (warn-only)
        continue-on-error: true
        run: |
          python scripts/phase9_eval_baseline.py --write /tmp/phase9-eval-baseline-current.json
          python - <<'PY'
          import json
          from pathlib import Path

          ref = Path("docs/acceptance-records/phase9-eval-baseline.json")
          cur = Path("/tmp/phase9-eval-baseline-current.json")
          if not cur.is_file():
              print("::warning::phase9 baseline check skipped: current baseline not generated")
              raise SystemExit(0)
          if not ref.is_file():
              print("::warning::phase9 baseline reference missing: docs/acceptance-records/phase9-eval-baseline.json")
              raise SystemExit(0)

          current = json.loads(cur.read_text(encoding="utf-8"))
          reference = json.loads(ref.read_text(encoding="utf-8"))
          checks = [
              ("cull_keep_ratio_non_featured.avg", 0.01),
              ("final_keep_ratio_non_featured.avg", 0.01),
              ("fail_open_rate", 0.0),
          ]

          def get_path(data, path):
              cur = data
              for part in path.split("."):
                  if not isinstance(cur, dict):
                      return None
                  cur = cur.get(part)
              return cur

          warnings = []
          for key, threshold in checks:
              cur_v = get_path(current, key)
              ref_v = get_path(reference, key)
              if cur_v is None or ref_v is None:
                  warnings.append(f"{key}: missing value (current={cur_v}, reference={ref_v})")
                  continue
              delta = float(cur_v) - float(ref_v)
              if key == "fail_open_rate":
                  if delta > threshold:
                      warnings.append(
                          f"{key}: increased by {delta:+.4f} (current={cur_v:.4f}, reference={ref_v:.4f})"
                      )
              elif abs(delta) > threshold:
                  warnings.append(
                      f"{key}: drift {delta:+.4f} > {threshold:.4f} (current={cur_v:.4f}, reference={ref_v:.4f})"
                  )

          if warnings:
              print("::warning::Phase9 baseline drift detected (warn-only): " + " | ".join(warnings))
              import os
              if os.environ.get("PHASE9_BASELINE_STRICT") == "1":
                  raise SystemExit(1)
          else:
              print("Phase9 baseline stable within warn-only thresholds")
          PY

      - name: Quality gate (layout + studio regression)
        run: python scripts/quality_gate.py

      - name: LTE validate (Phase 16 · schema + semantic CI gates)
        # --semantic runs V-P16-01~14 in ci mode (errors/blocks fail, warns allowed).
        # Bulk publish mode is intentionally NOT run here: deprecated templates
        # (e.g. *-balanced) block in publish by design and are gated per-template
        # at admission time instead.
        run: python -m travelogue.layout_templates.cli validate --semantic

      - name: LTE primitive catalog drift (W4)
        run: python -m travelogue.layout_templates.cli check-primitives

      - name: LTE journal CSS handwritten inventory
        run: python scripts/lte_journal_css_audit.py --fail-on-duplicates --fail-on-prefix-leak

      # LRG / LTN R-A1 · sync-journal also runs as PR block in test-pr; keep on push.
      - name: LTE journal CSS sync drift (release block)
        run: |
          python -m travelogue.layout_templates.cli export --sync-journal
          git diff --exit-code templates/visual-journal/journal-screens.css || {
            echo "journal-screens.css out of sync; run: python -m travelogue.layout_templates.cli export --sync-journal"
            exit 1
          }
          python -m travelogue.layout_templates.cli export --sync-portfolio
          git diff --exit-code templates/visual-journal/portfolio-pages.css || {
            echo "portfolio-pages.css out of sync; run: python -m travelogue.layout_templates.cli export --sync-portfolio"
            exit 1
          }

      - name: LTE slotAspect docgen drift
        run: |
          python -m travelogue.layout_templates.cli docgen --out /tmp/lte-slot-aspect
          python - <<'PY'
          import filecmp
          from pathlib import Path

          ref = Path("docs/templates/slot-aspect")
          cur = Path("/tmp/lte-slot-aspect")
          if not ref.is_dir() or not cur.is_dir():
              raise SystemExit("LTE docgen drift check: missing directories")
          diff = filecmp.dircmp(str(ref), str(cur))
          if diff.left_only or diff.right_only or diff.diff_files:
              print(
                  "LTE slotAspect docs drift: "
                  f"left_only={diff.left_only} right_only={diff.right_only} diff={diff.diff_files}"
              )
              raise SystemExit(1)
          print("LTE slotAspect docs in sync")
          PY

      - name: LTE probe regression (geometry warn)
        run: python scripts/lte_probe_regress.py

      - name: LTE probe regression (geometry strict · release)
        if: github.event_name != 'pull_request'
        run: python scripts/lte_probe_regress.py --strict-geometry

      - name: Install Playwright browser (LTE probe screenshots)
        run: playwright install chromium

      - name: LTE probe screenshot (PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/lte_probe_regress.py --screenshot

      - name: LTE probe screenshot (release block)
        if: github.event_name != 'pull_request'
        run: python scripts/lte_probe_regress.py --screenshot --strict

      - name: LTE registry parity
        run: python -m pytest tests/unit/layout_engine/test_lte_registry_parity.py -q --maxfail=1

      - name: LTE legacy export smoke (warn-only)
        continue-on-error: true
        run: |
          python scripts/lte_export_legacy.py --out /tmp/lte_legacy_export.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/lte_legacy_export.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert "mosaic_patterns" in data and data["mosaic_patterns"]
          print(f"legacy export ok: {len(data['mosaic_patterns'])} mosaic patterns")
          PY

      - name: LTE legacy Python snapshot drift
        run: |
          python scripts/lte_export_legacy.py --sync-python --out /tmp/lte_legacy_export.json
          git diff --exit-code travelogue/layout_engine/mosaic/_legacy_generated.py || {
            echo "_legacy_generated.py out of sync; run: python scripts/lte_export_legacy.py --sync-python"
            exit 1
          }

      - name: Collage detector fixture eval
        run: python scripts/collage_detect_eval.py --strict --min-recall 0.7 --max-fp-rate 0.25

      - name: Phase 16 template eval (AC-15 · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase16_template_eval.py --trips-dir tests/fixtures/phase16-dogfood --strict-ac15

      - name: Phase 16 template eval (AC-15 · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase16_template_eval.py --trips-dir tests/fixtures/phase16-dogfood --strict-ac15

      - name: Phase 17 golden metrics (AC-16～20 · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase17_golden_metrics.py

      - name: Phase 17 golden metrics (AC-16～20 · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_golden_metrics.py --strict

      - name: Phase 17 dogfood admission (PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase17_dogfood_admission.py --strict

      - name: Phase 17 dogfood admission (release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_dogfood_admission.py --strict

      - name: Phase 17 curate bench (AC-28 · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase17_curate_bench.py --fixture golden-mixed-scenes --fixture golden-p17-mixed-person --check

      - name: Phase 17 curate bench (AC-28 · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_curate_bench.py --fixture golden-mixed-scenes --fixture golden-p17-mixed-person --check

      - name: Phase 17 W3b-12 readiness (release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_w3b12_readiness.py --strict

      - name: Phase 17 strategy eval (render · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase17_strategy_eval.py --trips-dir tests/fixtures/phase16-dogfood --strict

      - name: Phase 17 strategy eval (render · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_strategy_eval.py --trips-dir tests/fixtures/phase16-dogfood --strict

      - name: Phase 4 acceptance gate
        run: python scripts/phase4_acceptance_gate.py --skip-integration

      - name: M21 dogfood gate (unit)
        run: python scripts/m21_dogfood_gate.py --skip-e2e
