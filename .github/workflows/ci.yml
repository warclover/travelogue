# PR job (test-pr) skips playwright_serial / e2e markers for speed.
# Merge to master/main requires test-e2e green (browser + longshot regression).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff (travelogue + tests + scripts)
        run: |
          python -m ruff check travelogue tests scripts

  test-pr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Pytest (PR fast · unit + unmarked)
        run: |
          python -m pytest tests/ -q \
            -m "not integration and not e2e and not vision and not playwright_serial and not legacy_homepage" \
            --cov=travelogue.web.studio_handlers \
            --cov=travelogue.web.studio_handlers.import_handlers \
            --cov=travelogue.web.studio_handlers.export_handlers \
            --cov=travelogue.web.studio_subprocess \
            --cov=travelogue.services.trip \
            --cov=travelogue.curation.mosaic \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=65

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Pytest (integration pipeline)
        run: |
          python -m pytest tests/ -q \
            -m "integration and not e2e and not vision and not playwright_serial and not legacy_homepage"

      - name: Phase 4 acceptance gate (integration)
        run: python scripts/phase4_acceptance_gate.py

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + Playwright
        run: |
          pip install -e ".[dev,playwright]"
          playwright install chromium

      - name: Pytest (e2e + browser)
        run: python -m pytest tests/ -q -m "(e2e or playwright_serial) and not legacy_homepage"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev,playwright]"

      - name: Validate fixtures
        run: |
          python scripts/validate_trip.py schemas/fixtures/trip.example.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.ingest_ready.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.structure_locked.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.copy_locked.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.render_golden.json --level all
          python scripts/validate_trip.py schemas/fixtures/trip.linzhi_screens.json --level all

      - name: Demo verify (fixtures + DOM)
        run: |
          python -c "from travelogue.demo.verify import run_demo_verify; import sys; r=run_demo_verify(skip_pytest=True); print('\n'.join(r.messages)); sys.exit(0 if r.ok else 1)"

      - name: Phase9 eval baseline drift (warn-only)
        continue-on-error: true
        run: |
          python scripts/phase9_eval_baseline.py --write /tmp/phase9-eval-baseline-current.json
          python - <<'PY'
          import json
          from pathlib import Path

          ref = Path("docs/acceptance-records/phase9-eval-baseline.json")
          cur = Path("/tmp/phase9-eval-baseline-current.json")
          if not cur.is_file():
              print("::warning::phase9 baseline check skipped: current baseline not generated")
              raise SystemExit(0)
          if not ref.is_file():
              print("::warning::phase9 baseline reference missing: docs/acceptance-records/phase9-eval-baseline.json")
              raise SystemExit(0)

          current = json.loads(cur.read_text(encoding="utf-8"))
          reference = json.loads(ref.read_text(encoding="utf-8"))
          checks = [
              ("cull_keep_ratio_non_featured.avg", 0.01),
              ("final_keep_ratio_non_featured.avg", 0.01),
              ("fail_open_rate", 0.0),
          ]

          def get_path(data, path):
              cur = data
              for part in path.split("."):
                  if not isinstance(cur, dict):
                      return None
                  cur = cur.get(part)
              return cur

          warnings = []
          for key, threshold in checks:
              cur_v = get_path(current, key)
              ref_v = get_path(reference, key)
              if cur_v is None or ref_v is None:
                  warnings.append(f"{key}: missing value (current={cur_v}, reference={ref_v})")
                  continue
              delta = float(cur_v) - float(ref_v)
              if key == "fail_open_rate":
                  if delta > threshold:
                      warnings.append(
                          f"{key}: increased by {delta:+.4f} (current={cur_v:.4f}, reference={ref_v:.4f})"
                      )
              elif abs(delta) > threshold:
                  warnings.append(
                      f"{key}: drift {delta:+.4f} > {threshold:.4f} (current={cur_v:.4f}, reference={ref_v:.4f})"
                  )

          if warnings:
              print("::warning::Phase9 baseline drift detected (warn-only): " + " | ".join(warnings))
              import os
              if os.environ.get("PHASE9_BASELINE_STRICT") == "1":
                  raise SystemExit(1)
          else:
              print("Phase9 baseline stable within warn-only thresholds")
          PY

      - name: Quality gate (layout + studio regression)
        run: python scripts/quality_gate.py

      - name: LTE validate (Phase 16 · schema + semantic CI gates)
        # --semantic runs V-P16-01~14 in ci mode (errors/blocks fail, warns allowed).
        # Bulk publish mode is intentionally NOT run here: deprecated templates
        # (e.g. *-balanced) block in publish by design and are gated per-template
        # at admission time instead.
        run: python -m travelogue.layout_templates.cli validate --semantic

      - name: LTE primitive catalog drift (W4)
        run: python -m travelogue.layout_templates.cli check-primitives

      - name: LTE journal CSS handwritten inventory
        run: python scripts/lte_journal_css_audit.py --fail-on-duplicates

      - name: LTE journal CSS sync drift
        run: |
          python -m travelogue.layout_templates.cli export --sync-journal
          git diff --exit-code templates/visual-journal/journal-screens.css || {
            echo "journal-screens.css out of sync; run: python -m travelogue.layout_templates.cli export --sync-journal"
            exit 1
          }

      - name: LTE slotAspect docgen drift
        run: |
          python -m travelogue.layout_templates.cli docgen --out /tmp/lte-slot-aspect
          python - <<'PY'
          import filecmp
          from pathlib import Path

          ref = Path("docs/templates/slot-aspect")
          cur = Path("/tmp/lte-slot-aspect")
          if not ref.is_dir() or not cur.is_dir():
              raise SystemExit("LTE docgen drift check: missing directories")
          diff = filecmp.dircmp(str(ref), str(cur))
          if diff.left_only or diff.right_only or diff.diff_files:
              print(
                  "LTE slotAspect docs drift: "
                  f"left_only={diff.left_only} right_only={diff.right_only} diff={diff.diff_files}"
              )
              raise SystemExit(1)
          print("LTE slotAspect docs in sync")
          PY

      - name: LTE probe regression (geometry warn)
        run: python scripts/lte_probe_regress.py

      - name: LTE probe regression (geometry strict · release)
        if: github.event_name != 'pull_request'
        run: python scripts/lte_probe_regress.py --strict-geometry

      - name: Install Playwright browser (LTE probe screenshots)
        run: playwright install chromium

      - name: LTE probe screenshot (PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/lte_probe_regress.py --screenshot

      - name: LTE probe screenshot (release block)
        if: github.event_name != 'pull_request'
        run: python scripts/lte_probe_regress.py --screenshot --strict

      - name: LTE registry parity
        run: python -m pytest tests/test_lte_registry_parity.py -q --maxfail=1

      - name: LTE legacy export smoke (warn-only)
        continue-on-error: true
        run: |
          python scripts/lte_export_legacy.py --out /tmp/lte_legacy_export.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/lte_legacy_export.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert "mosaic_patterns" in data and data["mosaic_patterns"]
          print(f"legacy export ok: {len(data['mosaic_patterns'])} mosaic patterns")
          PY

      - name: LTE legacy Python snapshot drift
        run: |
          python scripts/lte_export_legacy.py --sync-python --out /tmp/lte_legacy_export.json
          git diff --exit-code travelogue/curation/mosaic/_legacy_generated.py || {
            echo "_legacy_generated.py out of sync; run: python scripts/lte_export_legacy.py --sync-python"
            exit 1
          }

      - name: Collage detector fixture eval
        run: python scripts/collage_detect_eval.py --strict --min-recall 0.7 --max-fp-rate 0.25

      - name: Phase 16 template eval (AC-15 · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase16_template_eval.py --trips-dir tests/fixtures/phase16-dogfood --strict-ac15

      - name: Phase 16 template eval (AC-15 · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase16_template_eval.py --trips-dir tests/fixtures/phase16-dogfood --strict-ac15

      - name: Phase 17 golden metrics (AC-16～20 · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase17_golden_metrics.py

      - name: Phase 17 golden metrics (AC-16～20 · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_golden_metrics.py --strict

      - name: Phase 17 dogfood admission (PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase17_dogfood_admission.py --strict

      - name: Phase 17 dogfood admission (release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_dogfood_admission.py --strict

      - name: Phase 17 curate bench (AC-28 · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase17_curate_bench.py --fixture golden-mixed-scenes --fixture golden-p17-mixed-person --check

      - name: Phase 17 curate bench (AC-28 · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_curate_bench.py --fixture golden-mixed-scenes --fixture golden-p17-mixed-person --check

      - name: Phase 17 W3b-12 readiness (release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_w3b12_readiness.py --strict

      - name: Phase 17 strategy eval (render · PR warn)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/phase17_strategy_eval.py --trips-dir tests/fixtures/phase16-dogfood --strict

      - name: Phase 17 strategy eval (render · release block)
        if: github.event_name != 'pull_request'
        run: python scripts/phase17_strategy_eval.py --trips-dir tests/fixtures/phase16-dogfood --strict

      - name: Phase 4 acceptance gate
        run: python scripts/phase4_acceptance_gate.py --skip-integration

      - name: M21 dogfood gate (unit)
        run: python scripts/m21_dogfood_gate.py --skip-e2e
