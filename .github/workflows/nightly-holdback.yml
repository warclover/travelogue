# M20-i/j · holdback 演练（漏斗门禁 + LCP 审计）
# 定时已关闭以节省 Actions 分钟；需要时在 Actions 页手动 Run workflow。
# 合并后的 e2e 仍由 ci.yml（push to main）覆盖。
name: Nightly Holdback

on:
  workflow_dispatch:

jobs:
  holdback-funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + Playwright
        run: |
          pip install -e ".[dev,playwright]"
          playwright install chromium

      - name: M20-i funnel drill（synthetic · 必过）
        run: |
          python scripts/studio_homepage_m20i_drill.py \
            --spawn --synthetic --skip-lcp \
            --out holdback-funnel.json

      - uses: actions/upload-artifact@v4
        with:
          name: holdback-funnel-report
          path: holdback-funnel.json

      - name: Slack holdback alert（可选 · OQ-TELEMETRY）
        if: ${{ secrets.TRAVELOGUE_STUDIO_TELEMETRY_SLACK_WEBHOOK != '' }}
        continue-on-error: true
        env:
          TRAVELOGUE_STUDIO_TELEMETRY_SLACK_WEBHOOK: ${{ secrets.TRAVELOGUE_STUDIO_TELEMETRY_SLACK_WEBHOOK }}
        run: python scripts/studio_telemetry_alert.py --report holdback-funnel.json --notify

  holdback-lcp:
    runs-on: ubuntu-latest
    needs: holdback-funnel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + Playwright
        run: |
          pip install -e ".[dev,playwright]"
          playwright install chromium

      - name: M20-i LCP drill（10 runs · 审计）
        continue-on-error: true
        run: |
          python scripts/studio_homepage_m20i_drill.py \
            --spawn --synthetic --lcp-runs 10 --settle-ms 1200 \
            --out holdback-lcp.json

      - uses: actions/upload-artifact@v4
        with:
          name: holdback-lcp-report
          path: holdback-lcp.json

      - name: Studio homepage v2 AC e2e
        run: |
          python -m pytest tests/e2e/test_studio_home_v2_ac_playwright.py -q

      - name: Classic emergency smoke（M21-e1）
        run: |
          python -m pytest tests/unit/web/test_studio_home_v2.py -q --tb=short -k "gate_classic_serves_v3"

      - name: Rollback contract smoke（off -> legacy classic）
        run: |
          python -m pytest tests/unit/web/test_studio_home_v2.py -q --tb=short -k "gate_off_serves_v3_at_root"

      - name: Rollback drill（§3.2）
        run: python scripts/studio_homepage_rollback_drill.py
