# Output Recipe V1 · Preset 注册表（Phase A · D-OR-22）
# intent → preset_id → engine → platform（Job 兼容别名）
# Phase B：moments_grid / xiaohongshu 主卡；本文件仅声明 hook / 未开放项。

presets:
  preset.chat_longshot_single:
    intent: chat_longshot
    engine: chapter_capture
    platform: wechat_chat
    layout: single
    geometry: { mode: native_long, width: 428 }
    count_policy: { mode: auto }
    packing: none
    phases: [studio, cli]
    publish_guide_key: guide.chat_longshot
    cta_key: cta.sparse_chat
    product_label_key: label.chat_longshot

  preset.chat_longshot_chapter:
    intent: chat_longshot
    engine: chapter_capture
    platform: wechat_chat
    layout: by_chapter
    geometry: { mode: native_long, width: 428 }
    count_policy: { mode: auto }
    packing: none
    phases: [studio, cli]
    publish_guide_key: guide.chat_longshot
    cta_key: cta.narrative_chat
    product_label_key: label.chat_longshot

  preset.moments_scroll:
    intent: moments_scroll
    engine: platform_segment
    platform: wechat_moments
    layout: content_balanced
    geometry: { mode: native_long, width: 428 }
    count_policy: { mode: auto, max: 9 }
    packing: none
    phases: [studio, cli]
    publish_guide_key: guide.moments_scroll
    cta_key: cta.moments_scroll
    product_label_key: label.moments_scroll

  # Phase B · 真九宫格 Writer（CLI 兼容；Studio 已下线）
  preset.moments_grid:
    intent: moments_grid
    engine: photo_grid
    platform: moments_grid
    layout: grid
    geometry: { mode: fixed_aspect, width: 1080, height: 1080, aspect: "1:1" }
    count_policy: { mode: auto, max: 9 }
    packing: none
    phases: [cli]
    phase: B
    publish_guide_key: guide.moments_grid
    cta_key: cta.moments_grid
    product_label_key: label.moments_grid

  # PRD-EXPORT-CARD-COMPOSE-V1 · 单张 3:4 Card 海报（默认 Studio 开放）
  preset.poster_bric:
    intent: poster_bric
    engine: poster_bric
    platform: poster_bric
    layout: collage
    geometry: { mode: fixed_aspect, width: 1080, height: 1440, aspect: "3:4" }
    count_policy: { mode: auto, min: 1, max: 6 }
    packing: card_compose
    phases: [studio, cli]
    phase: GCS
    publish_guide_key: guide.poster_bric
    cta_key: cta.poster_bric
    product_label_key: label.poster_bric

  # Compose · 小红书竖版 3:4 多页拼贴海报（非杂志截屏）
  preset.xiaohongshu:
    intent: xiaohongshu
    engine: collage_pages
    platform: xiaohongshu
    layout: collage
    geometry: { mode: fixed_aspect, width: 1080, height: 1440, aspect: "3:4" }
    count_policy: { mode: auto, max: 18 }
    packing: card_compose
    phases: [studio, cli]
    phase: B
    publish_guide_key: guide.xiaohongshu
    product_label_key: label.xiaohongshu

  # PRD-EXPORT-CARD-COMPOSE-V1 · 画册印刷跨页（两张 3:4 Card + 中缝，约 1.53:1）
  preset.album_spread:
    intent: album_spread
    engine: collage_pages
    platform: album_spread
    layout: collage
    geometry: { mode: fixed_aspect, width: 2208, height: 1440, aspect: "1.53:1" }
    count_policy: { mode: auto, max: 30 }
    packing: card_compose
    phases: [studio, cli]
    phase: B
    publish_guide_key: guide.album_spread
    cta_key: cta.album_spread
    product_label_key: label.album_spread

  # Overseas · 仅 hook_only（G-OR-10）；永不改写 locale=zh 默认
  preset.instagram_carousel:
    intent: instagram_carousel
    engine: platform_segment
    platform: instagram
    layout: content_balanced
    geometry: { mode: fixed_aspect, width: 1080, height: 1350, aspect: "4:5" }
    count_policy: { mode: auto, max: 10 }
    packing: none
    pad_mode: letterbox
    phases: [hidden]
    phase: D
    instagram_preset_state: hook_only
    publish_guide_key: guide.instagram_carousel
    product_label_key: label.instagram_carousel

