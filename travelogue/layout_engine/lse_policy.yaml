# LSE global policy (PRD §7.1 · R-P17-02)
# W0 skeleton — runtime merge + rollout enforced in W1 registry loader.

policy_version: p17-2026-06

default_strategy_id: lse-default-2026-06
strategies_dir: travelogue/layout_engine/strategies

rollout:
  # W3a dogfood: global enabled=false; only allowlist / traffic bucket gets LSE.
  stage: dogfood
  traffic_percent: 0
  cohort_salt: travelogue-p17-w3a
  allowlist_trip_ids:
    - phase16-dogfood-portrait
    - phase16-dogfood-landscape
    - phase16-dogfood-mixed
  blocklist_trip_ids: []
  shadow_enabled: false

capabilities_defaults:
  saliency_scoring: false
  beat_profile: flat
  tone_harmony: false
  hungarian_assignment: false
  segment_order_optimizer: false
  implicit_feedback_export: false
  pace_profile: false
  highlight_windows: false
  editorial_hints: false

telemetry:
  emit_per_window: true
  decision_log_max_events: 2000
