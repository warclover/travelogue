# 三列等分 · 中满高竖主 + 两侧双横轨。experimental；勿写 lte_policy。
id: screen-mosaic-5-1p4l-portrait-center-rails
version: 1
status: experimental
kind: composite
displayName: 五图 · 1P4L 中竖主 + 双侧轨
description: >
  三列等宽：左上下双横 + 中满高竖 main + 右上下双横。
  与左竖主右四轨 1p4l-portrait-hero 同混比、不同几何；CSS-primary 等分三列。
aesthetic: hero_first
balancePolicy: equal_area

stage:
  aspect: "16:9"
  cols: [1, 1, 1]
  rows: [1, 1]
  gap: "3px"
  variants:
    - { layout: web, aspect: "16:9" }
    - { layout: mobile, aspect: "9:16" }

photoCount: { min: 5, max: 5 }
mix: { portrait: 1, landscape: 4 }

slots:
  - { index: 0, rect: [2, 2, 1, 2], role: main, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [1, 1, 1, 1], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 2, rect: [1, 1, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 3, rect: [3, 3, 1, 1], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 4, rect: [3, 3, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  arLadderSignOff:
    "0":
      signedBy: tri-col-center-rails
      signedAt: "2026-07-31"
      note: "Center full-height col AR≈0.593 (1/3×16:9); area≈0.333"
  eligibility:
    heroDominance: moderate
    heroAreaBand: [0.30, 0.40]
    slotIndex: 0
    targetDisplayAspect: 0.59
    eligibleAspectKinds: [portrait]
    forbidKinds: [panorama, landscape, square, tall]
    arLadderTol: 0.12
    preferLadder: [0.5625, 0.6667, 0.75]

compatibilityHints:
  prefers_burst: false
  avoid_near_scene_clones: true
  min_trip_photos: 12

scoring:
  base_weight: 1.02
  tags: [hero, portrait-main, 1p4l, tri-col, center-rails]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.08

render:
  gridClass: layout-screen__grid--mosaic-5-1p4l-portrait-center-rails
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 1
    min_landscape: 4
    max_portrait: 1
    max_landscape: 4
  css_verified: true

usage:
  summary: 1P4L 中竖主：中列满高人物 + 左右各上下双横轨。
  whenToUse: |
    - 窗口恰 1 竖 + 4 横，竖图适合居中满高展示时
    - 四横质量接近、适合双侧对称铺景时
  whenNotToUse: |
    - 竖主需要更大面积（应选 1p4l-portrait-hero，左满高面积 0.55）
    - 仅 2 竖（应选 2p3l / bookends 家族）
  designIntent: 三列等分中轴竖主；与左竖主四轨同混比互补。
  siblings:
    - id: screen-mosaic-5-1p4l-portrait-hero
      difference: 该模板左满高竖+右四横轨；本模板中竖+双侧双横。
    - id: screen-mosaic-4-2p2l-portrait-bookends
      difference: 该模板双侧竖书挡（2P2L）；本模板中竖主（1P4L）。
    - id: screen-landscape-6
      difference: 该模板六横 3×2 等分；本模板有中轴竖主。
