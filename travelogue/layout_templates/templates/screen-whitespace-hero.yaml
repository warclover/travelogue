id: screen-whitespace-hero
version: 1
status: experimental
schemaVersion: 2
kind: composite
displayName: whitespace · hero
description: >
  P19 whitespace-hero SKU — single hero with intentional margins and maxFillRatio
  scale-down (R-P19-404). Experimental until S4 Gate.
stage:
  aspect: '16:9'
  grid:
  - 1
  - 1
  margins:
    top: 8%
    right: 10%
    bottom: 8%
    left: 10%
photoCount:
  min: 1
  max: 1
mix:
  portrait: 1
  landscape: 0
maxFillRatio: 0.62
bleed: inset
slots:
- index: 0
  rect:
  - 1
  - 1
  - 1
  - 1
  role: portrait
  fit: contain
  aspectRange:
    min: 0.55
    max: 1.78
  cropPolicy: focal
constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
scoring:
  base_weight: 0.85
  tags: [whitespace, hero]
render:
  gridClass: layout-screen__grid--whitespace-hero
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate
rollout:
  percent: 0
  hash_key: tripId
