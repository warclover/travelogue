usage:
  summary: 六竖 3×2 密度格（9:16 舞台）：一屏六张竖图等分，适合连拍批量带过。
  whenToUse: |
    - 连续 ≥6 张竖图 run（美食、招牌、细节连拍等 mundane 标签）
    - 章节中段需要一次竖图密度高峰、且 rhythm 配额允许时
  whenNotToUse: |
    - 竖图张数不足 6 或质量参差明显时
    - 章内已有九宫格/大密度屏且缺少呼吸屏缓冲时
