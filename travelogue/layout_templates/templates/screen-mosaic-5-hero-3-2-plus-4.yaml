id: screen-mosaic-5-hero-3-2-plus-4
version: 3
status: ga
kind: composite
displayName: 五图 · 加权轨道 hero + 四配图
description: >
  加权轨道舞台（cols 2:1:1 × rows 1:1）主 hero 占左列满高 + 右上两格 + 底行两格。
  P16 §4.6 样板 composite，展示主大配小可变槽位与 CSS fr 轨道生成。
aesthetic: hero_first
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [2, 1, 1]
  rows: [1, 1]
  gap: "3px"

photoCount: { min: 5, max: 5 }
mix: { portrait: 0, landscape: 5 }

slots:
  - { index: 0, rect: [1, 1, 1, 2], role: main, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [2, 2, 1, 1], role: landscape, fit: cover, visualWeight: 0.6 }
  - { index: 2, rect: [3, 3, 1, 1], role: landscape, fit: cover, visualWeight: 0.6 }
  - { index: 3, rect: [2, 2, 2, 2], role: landscape, fit: cover, visualWeight: 0.6 }
  - { index: 4, rect: [3, 3, 2, 2], role: landscape, fit: cover, visualWeight: 0.6 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

compatibilityHints:
  prefers_burst: false
  min_trip_photos: 12

scoring:
  base_weight: 1.02
  tags: [hero, landscape, weighted]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.06

render:
  gridClass: layout-screen__grid--mosaic-5-hero-3-2-plus-4
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 5
    max_portrait: 0
    max_landscape: 5
  css_verified: true
