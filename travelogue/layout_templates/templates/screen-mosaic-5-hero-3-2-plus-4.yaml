id: screen-mosaic-5-hero-3-2-plus-4
version: 4
status: ga
kind: composite
displayName: 五图 · 加权轨道 hero + 四配图
description: >
  加权轨道舞台（cols 2:1:1 × rows 1:1）主 hero 占左列满高 + 右上两格 + 底行两格。
  P16 §4.6 样板 composite，展示主大配小可变槽位与 CSS fr 轨道生成。
aesthetic: hero_first
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [2, 1, 1]
  rows: [1, 1]
  gap: "3px"

photoCount: { min: 5, max: 5 }
mix: { portrait: 0, landscape: 5 }

slots:
  - { index: 0, rect: [1, 1, 1, 2], role: main, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [2, 2, 1, 1], role: landscape, fit: cover, visualWeight: 0.6 }
  - { index: 2, rect: [3, 3, 1, 1], role: landscape, fit: cover, visualWeight: 0.6 }
  - { index: 3, rect: [2, 2, 2, 2], role: landscape, fit: cover, visualWeight: 0.6 }
  - { index: 4, rect: [3, 3, 2, 2], role: landscape, fit: cover, visualWeight: 0.6 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots:
    - 0
  intentionalGaps: []
  arLadderSignOff:
    "0":
      signedBy: lte-design-review
      signedAt: "2026-06-07"
      note: Main hero slot displayAspect ~0.89; landscape forbidden (Plate 63 guard)

compatibilityHints:
  prefers_burst: false
  min_trip_photos: 12

scoring:
  base_weight: 0.98
  tags: [hero, mixed, weighted]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.06

render:
  gridClass: layout-screen__grid--mosaic-5-hero-3-2-plus-4
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 5
    max_portrait: 0
    max_landscape: 5
  css_verified: true
usage:
  summary: 加权轨道 5 图屏：左列满高主槽（偏竖 AR≈0.89）+ 右侧 2×2 四配图；主槽实为“竖形窗口”，与名字里的 hero 横图直觉相反。
  whenToUse: |
    - 5 张横图窗口中，主图裁成偏方/偏竖构图仍成立（中心构图、主体居中）时
    - 需要与 3×3 整数网格屏形成节奏差异（fr 加权轨道的非对称感）时
  whenNotToUse: |
    - 主图为宽幅风景、地平线构图时（cover 进 0.89 竖形槽会拦腰裁切；Plate 63 教训，
      现由 landscape_forbidden_tall + arLadderSignOff 守卫）
    - 四张配图差异过大时（右侧 2×2 等分格会放大参差感）
  designIntent: P16 §4.6 加权轨道样板；保留它主要为展示 fr 轨道能力，日常 hero 需求优先 main-hero-plus-4。
  siblings:
    - id: screen-mosaic-5-main-hero-plus-4
      difference: 该模板主槽是 16:9 横槽、6 张图；本模板主槽偏竖、5 张图，主图构图要求苛刻得多。
    - id: screen-mosaic-5-main-portrait-3land
      difference: 该模板主槽横、竖图放右侧窄槽；本模板反之，主槽本身就是竖形窗口。
