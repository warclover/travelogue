id: screen-portrait-2-gallery
version: 1
status: experimental
kind: primitive
displayName: portrait · 2 · gallery
description: >
  双竖画廊：两槽等大居中，四周留白（P2VF · V1 轮换集）。
  不替换 screen-portrait-2 满幅几何。
photoCount: { min: 2, max: 2 }

stage:
  aspect: "16:9"
  cols: [2, 6, 1, 6, 2]
  rows: [1, 8, 1]

mix: { portrait: 2, landscape: 0 }

slots:
  - { index: 0, rect: [2, 2, 2, 2], role: portrait, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [4, 4, 2, 2], role: portrait, fit: cover, visualWeight: 1.0 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  # Empty cells: top/bottom bands + side margins + center gutter (V-P16-02).
  intentionalGaps:
    - [1, 5, 1, 1]
    - [1, 5, 3, 3]
    - [1, 1, 2, 2]
    - [3, 3, 2, 2]
    - [5, 5, 2, 2]

scoring:
  base_weight: 0.90
  tags: [portrait-2, variant-gallery, editorial]

render:
  gridClass: layout-screen__grid--portrait-2-gallery
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 0
  zeroSince: "2026-07-20"
  hash_key: tripId

usage:
  summary: 双竖画廊：两槽等大居中，四周留白，杂志对页感。
  whenToUse: |
    - 连续 2 张竖图权重接近
    - 前屏为满幅拼贴/多槽，需要换气
  whenNotToUse: |
    - 一张明显更强（应选 asymmetric-left/right）
    - 任一方含人物（应选 screen-portrait-2）
    - 需要信息密度（应选 screen-portrait-2）
  designIntent: P2VF gallery · 舞台内留白呼吸，非满幅双竖。
  siblings:
    - id: screen-portrait-2
      difference: 满幅等分；本模板同等权重但约半屏留白。
    - id: screen-portrait-2-asymmetric-left
      difference: 该模板左主右辅；本模板对称画廊。
    - id: screen-portrait-2-asymmetric-right
      difference: 该模板右主左辅；本模板对称画廊。
