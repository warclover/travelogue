id: screen-landscape-1-portrait-1
version: 1
status: experimental
kind: composite
displayName: landscape · 1 · portrait · 1
description: >
  双图混排：左横右竖（mixed-1l1p · V1）。
  竖槽与舞台等高；剩余宽度给横槽（3:2），垂直居中。
photoCount: { min: 2, max: 2 }

stage:
  aspect: "16:9"
  # CSS-primary: 1fr | ~42.2% (3:4 @16:9). YAML tracks document intent only.
  cols: [16, 9]
  rows: [1]

mix: { portrait: 1, landscape: 1 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: landscape, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [2, 2, 1, 1], role: portrait, fit: cover, visualWeight: 0.95 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

scoring:
  base_weight: 0.92
  tags: [mixed-1l1p, variant-landscape-left, editorial]

render:
  gridClass: layout-screen__grid--landscape-left-portrait
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 0
  hash_key: tripId

usage:
  summary: 左横右竖：竖图与屏等高，横图占剩余宽度并垂直居中。
  whenToUse: |
    - 窗口恰 1 横 + 1 竖，且横图叙事/美学不弱于竖图
    - 需要混排成屏而非拆成两张单图
  whenNotToUse: |
    - 竖图明显更强（应选 screen-portrait-1-landscape-1）
    - 另有第二张横图可组成 portrait-1-landscape-2
  designIntent: mixed-1l1p · L|P · portrait full-bleed height.
  siblings:
    - id: screen-portrait-1-landscape-1
      difference: 镜像 P|L。
    - id: screen-portrait-1-landscape-2
      difference: 三图（1P+2L）；本模板仅双图。
