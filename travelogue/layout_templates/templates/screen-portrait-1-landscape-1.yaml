id: screen-portrait-1-landscape-1
version: 1
status: deprecated  # C-02 · 2026-08-28 overdue rolloutZero → archive
kind: composite
displayName: portrait · 1 · landscape · 1
description: >
  双图混排：左竖右横（mixed-1l1p · V1）。
  两槽均与舞台等高；竖列约 3:4 开孔，横列占剩余宽度，cover 铺满。
photoCount: { min: 2, max: 2 }

stage:
  aspect: "16:9"
  # CSS-primary: ~42.2% (3:4 @16:9) | 1fr. YAML tracks document intent only.
  cols: [9, 16]
  rows: [1]

mix: { portrait: 1, landscape: 1 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: portrait, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [2, 2, 1, 1], role: landscape, fit: cover, visualWeight: 0.95 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

scoring:
  base_weight: 0.92
  tags: [mixed-1l1p, variant-portrait-left, editorial]

render:
  gridClass: layout-screen__grid--portrait-left-landscape
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 0
  zeroSince: "2026-07-20"
  hash_key: tripId

usage:
  summary: 左竖右横：两槽均与屏等高；竖列约 3:4 开孔，横列占剩余宽度 cover 铺满。
  whenToUse: |
    - 窗口恰 1 竖 + 1 横，且竖图叙事/美学更强或接近
    - 需要混排成屏而非拆成两张单图
  whenNotToUse: |
    - 横图明显更强（应选 screen-landscape-1-portrait-1）
    - 另有第二张横图可组成 portrait-1-landscape-2
  designIntent: mixed-1l1p · P|L · portrait full-bleed height.
  siblings:
    - id: screen-landscape-1-portrait-1
      difference: 镜像 L|P。
    - id: screen-portrait-1-landscape-2
      difference: 三图（1P+2L）；本模板仅双图。
