id: screen-spread-folio
version: 1
status: experimental
schemaVersion: 2
kind: composite
displayName: spread · folio dual hero
description: >
  P19 spread-folio SKU — paired landscape heroes across a gutter (R-P19-405).
  Designer folio language; web screens only until S5 Gate.
aesthetic: hero_first
balancePolicy: equal_width
stage:
  aspect: '16:9'
  cols:
  - 1
  - 1
  rows:
  - 1
  gap: 4px
  margins:
    top: 5%
    right: 6%
    bottom: 5%
    left: 6%
photoCount:
  min: 2
  max: 2
mix:
  portrait: 0
  landscape: 2
bleed: inset
slots:
- index: 0
  rect:
  - 1
  - 1
  - 1
  - 1
  role: main
  fit: cover
  aspectRange:
    min: 1.2
    max: 2.0
  cropPolicy: focal
- index: 1
  rect:
  - 2
  - 2
  - 1
  - 1
  role: main
  fit: cover
  aspectRange:
    min: 1.2
    max: 2.0
  cropPolicy: focal
constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
scoring:
  base_weight: 0.88
  tags: [spread, folio, designer]
  rhythm:
    diversity_bonus: 0.1
render:
  gridClass: layout-screen__grid--spread-folio
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate
rollout:
  percent: 15
  hash_key: tripId
_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 2
    max_portrait: 0
    max_landscape: 2
  css_verified: true
