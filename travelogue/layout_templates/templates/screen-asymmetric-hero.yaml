id: screen-asymmetric-hero
version: 1
status: experimental
schemaVersion: 2
kind: composite
displayName: asymmetric · hero + sidebar
description: >
  P19 asymmetric-hero SKU — dominant left hero with right sidebar strip (R-P19-405).
aesthetic: hero_first
balancePolicy: weighted_tracks
stage:
  aspect: '16:9'
  cols:
  - 2
  - 1
  rows:
  - 1
  - 1
  - 1
  gap: 3px
photoCount:
  min: 4
  max: 4
mix:
  portrait: 0
  landscape: 4
slots:
- index: 0
  rect:
  - 1
  - 1
  - 1
  - 3
  role: main
  fit: cover
  visualWeight: 1.0
  aspectRange:
    min: 1.1
    max: 2.0
  cropPolicy: focal
- index: 1
  rect:
  - 2
  - 2
  - 1
  - 1
  role: landscape
  fit: cover
  visualWeight: 0.55
- index: 2
  rect:
  - 2
  - 2
  - 2
  - 2
  role: landscape
  fit: cover
  visualWeight: 0.55
- index: 3
  rect:
  - 2
  - 2
  - 3
  - 3
  role: landscape
  fit: cover
  visualWeight: 0.55
constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots:
  - 0
  intentionalGaps: []
scoring:
  base_weight: 0.9
  tags: [asymmetric, hero, designer]
  rhythm:
    max_per_chapter: 3
    diversity_bonus: 0.08
render:
  gridClass: layout-screen__grid--asymmetric-hero
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate
rollout:
  percent: 15
  hash_key: tripId
_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 4
    max_portrait: 0
    max_landscape: 4
  css_verified: true
