id: screen-mosaic-6-grid-hero-br
version: 1
status: experimental
kind: composite
displayName: 六图 · L 形五小格 + 右下 hero 大格
description: >
  UC-6-GRID-HERO-BR：3×3 舞台 — 上排 3 小横格 + 左列下 2 小横格（L 形五辅图）
  + 右下 2×2 大格主 hero。拓扑与 mosaic-6-main-hero-plus-5（左上 hero）不同。
aesthetic: hero_first

stage:
  aspect: "16:9"
  grid: [3, 3]
  gap: "3px"

photoCount: { min: 6, max: 6 }
mix: { portrait: 0, landscape: 6 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: landscape, fit: cover, visualWeight: 0.5 }
  - { index: 1, rect: [2, 2, 1, 1], role: landscape, fit: cover, visualWeight: 0.5 }
  - { index: 2, rect: [3, 3, 1, 1], role: landscape, fit: cover, visualWeight: 0.5 }
  - { index: 3, rect: [1, 1, 2, 2], role: landscape, fit: cover, visualWeight: 0.5 }
  - { index: 4, rect: [1, 1, 3, 3], role: landscape, fit: cover, visualWeight: 0.5 }
  - { index: 5, rect: [2, 3, 2, 3], role: main, fit: cover, visualWeight: 1.0 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  mainSlotPolicy:
    slotIndex: 5
    targetDisplayAspect: 1.7778
    eligibleAspectKinds: [landscape, panorama]
    forbidKinds: [portrait, tall, square]
    arLadderTol: 0.08
    preferLadder: [1.7778, 1.5, 1.3333]

compatibilityHints:
  prefers_burst: false
  min_trip_photos: 14

scoring:
  base_weight: 1.0
  tags: [hero, grid_l, bottom_right]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.05

render:
  gridClass: layout-screen__grid--mosaic-6-grid-hero-br
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 6
    max_portrait: 0
    max_landscape: 6
  css_verified: true
