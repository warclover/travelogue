id: screen-mosaic-5-2p3l-equal
version: 2
status: deprecated
kind: composite
displayName: 五图 · 双竖 hero + 三横右栏
description: >
  左中两列满高双竖 hero（displayAspect≈0.59）+ 右栏三等高横图（1.78）。
  3×3 整数网格下唯一可无缝平铺、不留空位、不把竖图塞进宽格的 2P+3L 拓扑。
  已退役：新 trip 不再候选；历史 screens[] 仍可渲染。
aesthetic: dense
balancePolicy: equal_height

stage:
  aspect: "16:9"
  grid: [3, 3]
  gap: "2px"
  variants:
    - { layout: web, aspect: "16:9" }
    - { layout: mobile, aspect: "9:16" }

photoCount: { min: 5, max: 5 }
mix: { portrait: 2, landscape: 3 }

slots:
  - { index: 0, rect: [1, 1, 1, 3], role: portrait, fit: auto, visualWeight: 0.95 }
  - { index: 1, rect: [2, 2, 1, 3], role: portrait, fit: auto, visualWeight: 0.95 }
  - { index: 2, rect: [3, 3, 1, 1], role: landscape, fit: cover, visualWeight: 0.70 }
  - { index: 3, rect: [3, 3, 2, 2], role: landscape, fit: cover, visualWeight: 0.70 }
  - { index: 4, rect: [3, 3, 3, 3], role: landscape, fit: cover, visualWeight: 0.70 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

compatibilityHints:
  prefers_burst: true
  min_trip_photos: 12

scoring:
  base_weight: 1.05
  tags: [family, indoor, mixed]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.08

render:
  gridClass: layout-screen__grid--mosaic-5-2p3l-equal
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 0
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 2
    min_landscape: 3
    max_portrait: 2
    max_landscape: 3
  css_verified: true
usage:
  summary: 已退役的 2 竖 + 3 横无缝拼屏：双竖 hero 满高占左中两列，右栏三横等高。
  whenNotToUse: |
    - 已退役（rollout 0%）：新 trip 不再候选，仅保留渲染历史 screens[]。
    - 退役背景：双竖等宽满高信息密度过高、缺主次，被主图引领类模板取代。
  siblings:
    - id: screen-mosaic-5-2portrait-3land-balanced
      difference: 更早的 2P3L 前身（右上留空缺陷），本模板曾是其修正版；两者均已退役。
    - id: screen-mosaic-5-main-portrait-3land
      difference: 现役的竖图混排方案：仅收 1 竖且有明确主横图，密度更克制。
