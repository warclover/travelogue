# MTSO PR-C2 · O-1 合同冻结稿（算法侧）：左满高竖 main + 右四横轨。
# experimental；勿写入 lte_policy / MOSAIC_5_PATTERN_IDS 直至 M3 转正。
id: screen-mosaic-5-1p4l-portrait-hero
version: 1
status: experimental
kind: composite
displayName: 五图 · 竖主满高 + 四横侧轨
description: >
  MTSO 1P4L 竖主横辅：左列加权满高竖 main（面积 0.55）+ 右列四横细节轨。
  与横主竖辅 screen-mosaic-5-main-portrait-3land 双分支对偶。
aesthetic: hero_first
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [11, 9]
  rows: [1, 1, 1, 1]
  gap: "3px"
  variants:
    - { layout: web, aspect: "16:9" }
    - { layout: mobile, aspect: "9:16" }

photoCount: { min: 5, max: 5 }
mix: { portrait: 1, landscape: 4 }

slots:
  - { index: 0, rect: [1, 1, 1, 4], role: main, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [2, 2, 1, 1], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 2, rect: [2, 2, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 3, rect: [2, 2, 3, 3], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 4, rect: [2, 2, 4, 4], role: landscape, fit: cover, visualWeight: 0.55 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  arLadderSignOff:
    "0":
      signedBy: mtso-o1-contract
      signedAt: "2026-07-23"
      note: Portrait-hero main displayAspect ~0.978 (11:9×16:9); O-1 freeze
  eligibility:
    heroDominance: extreme
    heroAreaBand: [0.55, 0.70]
    slotIndex: 0
    # 11:9 × 16:9 满高列 → 显示 AR ≈ 0.978
    targetDisplayAspect: 0.98
    eligibleAspectKinds: [portrait]
    forbidKinds: [panorama, landscape, square, tall]
    arLadderTol: 0.12
    preferLadder: [0.75, 0.6667, 0.5625]

compatibilityHints:
  prefers_burst: false
  avoid_near_scene_clones: true
  min_trip_photos: 12

scoring:
  base_weight: 1.08
  tags: [hero, portrait-main, 1p4l, mtso-c2]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.08

render:
  gridClass: layout-screen__grid--mosaic-5-1p4l-portrait-hero
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  # lifecycle_admit still gates experimental; percent>0 for size-path extras
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 1
    min_landscape: 4
    max_portrait: 1
    max_landscape: 4
  css_verified: true

usage:
  summary: 竖主满高领衔 + 右四横轨：强竖 1P4L 时替代横主竖辅。
  whenToUse: |
    - 窗口 1 竖 + 4 横，且竖图为窗内最强或相对最强横 gap≥阈值（mixed_portrait_is_hero）
    - 竖图为人物/门洞/塔楼等纵向主体，需要满高主导面积时
  whenNotToUse: |
    - 横图才是合格主角、竖适合窄槽配角时（应选 main-portrait-3land）
    - 竖图不足 1 或横图不足 4
  designIntent: MTSO D-MTSO-03 竖主分支；O-1 左满高竖合同冻结稿。
  siblings:
    - id: screen-mosaic-5-main-portrait-3land
      difference: 该模板横主竖辅；本模板竖主横辅。
    - id: screen-mosaic-5-1p4l-portrait-center-rails
      difference: 该模板中竖主+双侧双横；本模板左满高竖+右四横轨。
    - id: screen-portrait-1
      difference: 该模板单图 rescue；本模板保留四横细节轨。
    - id: screen-mosaic-5-2p3l-portrait-hero-rail
      difference: 该模板 2 竖主从；本模板仅 1 竖。
