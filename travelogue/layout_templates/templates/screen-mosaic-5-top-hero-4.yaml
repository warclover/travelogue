id: screen-mosaic-5-top-hero-4
version: 1
status: experimental
kind: composite
displayName: 五图 · 上大 hero + 下四等分
description: >
  UC-5A-TOP-HERO-4：上 1 全宽横条 hero（约 75% 舞台高，rows 3:1）+ 下 1 行 4 等分横格。
  Phase 20 版式用例 · 与 mosaic-5 现网族拓扑不同。
aesthetic: hero_first
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [1, 1, 1, 1]
  rows: [3, 1]
  gap: "3px"

photoCount: { min: 5, max: 5 }
mix: { portrait: 0, landscape: 5 }

slots:
  - { index: 0, rect: [1, 4, 1, 1], role: main, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [1, 1, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 2, rect: [2, 2, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 3, rect: [3, 3, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 4, rect: [4, 4, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  mainSlotPolicy:
    slotIndex: 0
    targetDisplayAspect: 2.3704
    eligibleAspectKinds: [landscape, panorama]
    forbidKinds: [portrait, tall, square]
    arLadderTol: 0.1
    preferLadder: [2.3704, 1.7778, 1.5, 1.3333]

compatibilityHints:
  prefers_burst: false
  min_trip_photos: 12

scoring:
  base_weight: 1.0
  tags: [hero, top_hero, weighted]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.05

render:
  gridClass: layout-screen__grid--mosaic-5-top-hero-4
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 5
    max_portrait: 0
    max_landscape: 5
  css_verified: true
