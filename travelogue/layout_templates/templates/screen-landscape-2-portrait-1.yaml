id: screen-landscape-2-portrait-1
version: 1
status: experimental
kind: composite
displayName: landscape · 2 · portrait · 1
description: >
  双横+竖镜像：左两横叠 + 右竖满高（mixed-1p2l · V1）。
  fill 为 screen-portrait-1-landscape-2。
photoCount: { min: 3, max: 3 }

stage:
  aspect: "16:9"
  cols: [1, 1]
  rows: [1, 1]

mix: { portrait: 1, landscape: 2 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: landscape, fit: cover, visualWeight: 0.85 }
  - { index: 1, rect: [1, 1, 2, 2], role: landscape, fit: cover, visualWeight: 0.85 }
  - { index: 2, rect: [2, 2, 1, 2], role: portrait, fit: cover, visualWeight: 1.0 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

scoring:
  base_weight: 0.92
  tags: [mixed-1p2l, variant-landscape-left, editorial]

render:
  gridClass: layout-screen__grid--2landscape-right-portrait
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 0
  hash_key: tripId

usage:
  summary: 左两横叠、右竖满高：p1l2 镜像。
  whenToUse: |
    - 窗口 1 竖 + 2 横，且需右竖叙事
  whenNotToUse: |
    - 竖图含人（硬拒混排）
    - 默认左竖布局足够（应选 screen-portrait-1-landscape-2）
  designIntent: mixed-1p2l · L2|P mirror of GA p1l2.
  siblings:
    - id: screen-portrait-1-landscape-2
      difference: 左竖右两横（GA fill）。
