id: screen-full-frame
version: 1
status: ga
kind: primitive
displayName: 全幅单图
description: >
  Collage 及需整图完整展示的单图模板；fit 默认 contain，AR 不匹配处用 blurred fill。
photoCount: { min: 1, max: 1 }

stage:
  aspect: "16:9"
  cols: [1]
  rows: [1]

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: landscape, fit: contain }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

scoring:
  base_weight: 1.0
  tags: [collage, single]

render:
  gridClass: layout-screen__grid--1col
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 0
    max_portrait: 1
    max_landscape: 1
  css_verified: true
usage:
  summary: 全幅单图 contain：整图完整展示，AR 不匹配处 blur fill；collage/特殊比例专用。
  whenToUse: |
    - collage 类素材或 ingest 标记需完整展示、不宜 cover 裁切时
    - 全景/超长比例/截图类图片，cover 会损失关键信息时
  whenNotToUse: |
    - 常规横/竖照片需要满屏冲击力时（应选 landscape-1 / portrait-1 cover）
    - 多图窗口（photoCount=1 硬约束）
  siblings:
    - id: screen-landscape-1
      difference: 该模板 cover 满屏横图；本模板 contain + blur fill，保完整不裁切。
    - id: screen-portrait-1
      difference: 该模板 9:16 竖图 cover；本模板 16:9 contain，面向特殊比例整图。
