id: screen-mosaic-5-left3-right2
version: 1
status: experimental
kind: composite
displayName: 五图 · 左三小 + 右 hero + 右下宽条
description: >
  UC-5B-LEFT3-RIGHT2：左列 3 小横格竖叠 + 右列上 1 大横 hero（占 2/3 高）
  + 右下 1 宽横条（与左列底格同行）。拓扑与 hero-3-2-plus-4（左 hero）镜像区分。
aesthetic: hero_first
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [1, 2]
  rows: [1, 1, 1]
  gap: "3px"

photoCount: { min: 5, max: 5 }
mix: { portrait: 0, landscape: 5 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: landscape, fit: cover, visualWeight: 0.5 }
  - { index: 1, rect: [1, 1, 2, 2], role: landscape, fit: cover, visualWeight: 0.5 }
  - { index: 2, rect: [1, 1, 3, 3], role: landscape, fit: cover, visualWeight: 0.5 }
  - { index: 3, rect: [2, 2, 1, 2], role: main, fit: cover, visualWeight: 1.0 }
  - { index: 4, rect: [2, 2, 3, 3], role: landscape, fit: cover, visualWeight: 0.6 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  mainSlotPolicy:
    slotIndex: 3
    targetDisplayAspect: 1.7778
    eligibleAspectKinds: [landscape, panorama]
    forbidKinds: [portrait, tall, square]
    arLadderTol: 0.08
    preferLadder: [1.7778, 1.5, 1.3333]

compatibilityHints:
  prefers_burst: false
  min_trip_photos: 12

scoring:
  base_weight: 0.98
  tags: [hero, left_strip, weighted]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.06

render:
  gridClass: layout-screen__grid--mosaic-5-left3-right2
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 5
    max_portrait: 0
    max_landscape: 5
  css_verified: true
