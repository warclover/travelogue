# MTSO PR-D · 2P3L 竖主从可读几何（三列）：左满高 main + 中满高辅竖 + 右三横轨。
# 辅竖须 portrait 可读（非横宽条）；主槽≥0.55、主从≥3:1。experimental；勿写 lte_policy。
id: screen-mosaic-5-2p3l-portrait-hero-rail
version: 1
status: experimental
kind: composite
displayName: 五图 · 2P3L 竖主从 + 三横轨
description: >
  MTSO 2P3L 主从继任：左满高竖 main（面积 0.55）+ 中列满高辅竖（可读竖）+ 右列三横细节。
  主从面积比 ≥3:1；非等权双满高，亦非右上横宽伪竖。
aesthetic: hero_first
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [11, 3, 6]
  rows: [1, 1, 1]
  gap: "3px"
  variants:
    - { layout: web, aspect: "16:9" }
    - { layout: mobile, aspect: "9:16" }

photoCount: { min: 5, max: 5 }
mix: { portrait: 2, landscape: 3 }

slots:
  - { index: 0, rect: [1, 1, 1, 3], role: main, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [2, 2, 1, 3], role: portrait, fit: cover, visualWeight: 0.70 }
  - { index: 2, rect: [3, 3, 1, 1], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 3, rect: [3, 3, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 4, rect: [3, 3, 3, 3], role: landscape, fit: cover, visualWeight: 0.55 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  arLadderSignOff:
    "0":
      signedBy: mtso-prd-geo
      signedAt: "2026-07-23"
      note: "Portrait-hero main ~0.978 AR (11/20×16:9); aux col AR~0.267 (3/20×16:9)"
    "1":
      signedBy: mtso-prd-geo
      signedAt: "2026-07-23"
      note: Aux full-height portrait rail (readable vertical, not landscape strip)
  eligibility:
    heroDominance: extreme
    heroAreaBand: [0.55, 0.70]
    slotIndex: 0
    targetDisplayAspect: 0.98
    eligibleAspectKinds: [portrait]
    forbidKinds: [panorama, landscape, square, tall]
    arLadderTol: 0.12
    preferLadder: [0.75, 0.6667, 0.5625]

compatibilityHints:
  prefers_burst: true
  min_trip_photos: 12

scoring:
  base_weight: 1.06
  tags: [hero, portrait-main, 2p3l, mtso-c2]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.08

render:
  gridClass: layout-screen__grid--mosaic-5-2p3l-portrait-hero-rail
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 2
    min_landscape: 3
    max_portrait: 2
    max_landscape: 3
  css_verified: true

usage:
  summary: 2P3L 主从：一竖主导满高、次竖中列可读、三横右轨细节。
  whenToUse: |
    - 窗口恰 2 竖 + 3 横，且需要明确主从（非双竖并肩等权）时
    - 主竖质量/叙事明显高于次竖时
  whenNotToUse: |
    - 两竖应等权并肩（勿用本模板充数；等权狗粮见 2p3l-rail，且永不转 GA）
    - 仅 1 竖（应选 1p4l-portrait-hero 或 main-portrait-3land）
  designIntent: MTSO D-MTSO-04 方案 A；PR-D 辅竖可读几何；转正前 experimental。
  siblings:
    - id: screen-mosaic-5-2p3l-rail
      difference: 该模板双满高等权，非继任；本模板主从加权。
    - id: screen-mosaic-5-1p4l-portrait-hero
      difference: 该模板 1 竖；本模板 2 竖主从。
    - id: screen-mosaic-5-2p3l-equal
      difference: 已退役等权拓扑。
