usage:
  summary: 1 竖 + 4 横的混排 5 图屏：16:9 主横图 2×2 领衔，竖图立于右列满高窄槽，底行三横收尾。
  whenToUse: |
    - 窗口恰有 1 张竖图夹在横图连拍中，单独成屏会打断节奏时
    - 竖图是人物/门洞/塔楼等纵向主体，放高窄槽（AR≈0.59）反而增强张力时
  whenNotToUse: |
    - 竖图本身是窗口里最强的一张时（它只占右列窄槽，会被主横图压制；
      此时应让竖图走 screen-portrait-1 独立成屏）
    - 主槽无合格 16:9 横图时（mainSlotPolicy 硬禁全景/竖/方图入主槽）
  designIntent: 解决“横图流里孤立竖图”的收容问题：竖图不降格为被裁的方块，而是获得满高展示位。
  siblings:
    - id: screen-mosaic-5-main-hero-plus-4
      difference: 该模板全横 6 图；本模板专为混入 1 张竖图的 5 图窗口设计。
    - id: screen-mosaic-5-main-landscape-2portrait-2land
      difference: 已退役的同族前身，槽位相同但缺主槽 AR 守卫；新 trip 一律用本模板。
    - id: screen-portrait-1-landscape-2
      difference: 该模板 3 图、竖图为主角；本模板 5 图、竖图为配角。
