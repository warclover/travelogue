id: screen-portrait-1
version: 1
status: ga
kind: primitive
displayName: 单张竖版
description: 章末孤儿竖图 cover 满屏（screen_planner · AC-P16-02）。
photoCount: { min: 1, max: 1 }

stage:
  aspect: "9:16"
  cols: [1]
  rows: [1]

mix: { portrait: 1, landscape: 0 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: portrait, fit: cover }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

scoring:
  base_weight: 1.0
  tags: [portrait, single]

render:
  gridClass: layout-screen__grid--1col
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate
usage:
  summary: 单竖满屏（9:16 舞台 cover）：一张竖图独占一屏，章末孤儿竖图或强竖构图专用。
  whenToUse: |
    - 单张竖图质量突出，值得独占一屏时
    - 章末 carry-forward 的孤儿竖图、late chapter pairing 收尾时
  whenNotToUse: |
    - 竖图一般、后面还有竖 run 可成组（应选 portrait-2 / portrait-3-editorial）
    - 素材实为横图或全景（应选 landscape-1 / full-frame）
  siblings:
    - id: screen-portrait-2
      difference: 该模板双竖并列；本模板单竖满屏，冲击力更大。
    - id: screen-full-frame
      difference: 该模板 contain 保完整；本模板 cover 满屏，适合标准竖图。
