id: screen-portrait-3-editorial
version: 1
status: beta
kind: primitive
displayName: portrait · 3 · editorial
description: 杂志式三竖并列行（视觉 intrinsic · 脚线对齐 · PRD portrait-row-editorial）
stage:
  aspect: '16:9'
  grid:
  - 3
  - 1
photoCount:
  min: 3
  max: 3
mix:
  portrait: 3
  landscape: 0
slots:
- index: 0
  rect:
  - 1
  - 1
  - 1
  - 1
