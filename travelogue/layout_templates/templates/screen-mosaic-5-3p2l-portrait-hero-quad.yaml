# 3P2L · 左满高竖主 + 右 2×2（上双竖 / 下双横）。experimental；勿写 lte_policy。
id: screen-mosaic-5-3p2l-portrait-hero-quad
version: 1
status: experimental
kind: composite
displayName: 五图 · 3P2L 竖主 + 右四宫
description: >
  左满高竖 main（面积 0.55，AR≈0.978）+ 右上双竖对照 + 右下双横铺景。
  主从面积比 ≥3:1；吃竖人多、横景辅的窗口。
aesthetic: hero_first
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [22, 9, 9]
  rows: [1, 1]
  gap: "3px"
  variants:
    - { layout: web, aspect: "16:9" }
    - { layout: mobile, aspect: "9:16" }

photoCount: { min: 5, max: 5 }
mix: { portrait: 3, landscape: 2 }

slots:
  - { index: 0, rect: [1, 1, 1, 2], role: main, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [2, 2, 1, 1], role: portrait, fit: cover, visualWeight: 0.62 }
  - { index: 2, rect: [3, 3, 1, 1], role: portrait, fit: cover, visualWeight: 0.62 }
  - { index: 3, rect: [2, 2, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }
  - { index: 4, rect: [3, 3, 2, 2], role: landscape, fit: cover, visualWeight: 0.55 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  arLadderSignOff:
    "0":
      signedBy: 3p2l-hero-quad
      signedAt: "2026-07-27"
      note: "Portrait-hero main ~0.978 AR / area 0.55 (11/20×16:9; align 2p3l-portrait-hero-rail)"
  eligibility:
    heroDominance: extreme
    heroAreaBand: [0.55, 0.70]
    slotIndex: 0
    # Gate uses target vs native AR (max ratio 1.4). Keep 0.75 so typical
    # 2:3 portraits admit; visual slot AR remains ~0.978 via cols [22,9,9].
    targetDisplayAspect: 0.75
    eligibleAspectKinds: [portrait]
    forbidKinds: [panorama, landscape, square, tall]
    arLadderTol: 0.12
    preferLadder: [0.75, 0.6667, 0.5625]

compatibilityHints:
  prefers_burst: true
  min_trip_photos: 12

scoring:
  base_weight: 1.05
  tags: [hero, portrait-main, 3p2l, quad]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.08

render:
  gridClass: layout-screen__grid--mosaic-5-3p2l-portrait-hero-quad
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 3
    min_landscape: 2
    max_portrait: 3
    max_landscape: 2
  css_verified: true

usage:
  summary: 3P2L 竖主：左满高人物 + 右上双竖 + 右下双横。
  whenToUse: |
    - 窗口恰 3 竖 + 2 横，且一张竖图明显更强可作满高主槽
    - 另两竖适合半身/对照，两横作场景铺底
  whenNotToUse: |
    - 仅 2 竖（应选 2p3l-portrait-hero-rail）
    - 横图信息量明显高于辅竖（应选 3p2l-portrait-hero-lp-stack）
  designIntent: 左竖主杂志页；与 lp-stack 同混比软轮换。
  siblings:
    - id: screen-mosaic-5-3p2l-portrait-hero-lp-stack
      difference: 右侧为（横|竖）×2 成对，而非上竖下横四宫。
    - id: screen-mosaic-5-2p3l-portrait-hero-rail
      difference: 该模板 2P3L；本模板 3P2L。
    - id: screen-mosaic-5-3portrait-2land-balanced
      difference: 已退役等权带状，无左满高主槽。
