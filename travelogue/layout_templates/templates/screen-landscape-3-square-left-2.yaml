id: screen-landscape-3-square-left-2
version: 1
status: experimental
kind: composite
displayName: 三图 · 左近方 + 右双横
description: >
  UC-3-SQUARE-LEFT-2：左 1 近方图（AR 0.85–1.15）+ 右 2 标准横版上下叠。
  contain + 同高 stage；方图与横图高度差以留白处理。
stage:
  aspect: "16:9"
  cols: [1, 2]
  rows: [1, 1]
  gap: "3px"

photoCount: { min: 3, max: 3 }
mix: { portrait: 0, landscape: 3 }

slots:
  - { index: 0, rect: [1, 1, 1, 2], role: square, fit: contain, visualWeight: 0.85 }
  - { index: 1, rect: [2, 2, 1, 1], role: landscape, fit: contain, visualWeight: 0.7 }
  - { index: 2, rect: [2, 2, 2, 2], role: landscape, fit: contain, visualWeight: 0.7 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

compatibilityHints:
  prefers_square: true
  square_aspect_min: 0.85
  square_aspect_max: 1.15

scoring:
  base_weight: 0.95
  tags: [square_anchor, contain_stack]

render:
  gridClass: layout-screen__grid--landscape-3-square-left-2
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 3
    max_portrait: 0
    max_landscape: 3
  css_verified: true
