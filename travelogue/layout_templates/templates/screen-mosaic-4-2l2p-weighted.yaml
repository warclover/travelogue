id: screen-mosaic-4-2l2p-weighted
version: 1
status: experimental
kind: composite
displayName: 四图 · 加权棋盘 2L2P
description: >
  TPC W3：相对等分 portrait-2-landscape-2 的杂志感 2L2P。
  TL/BR 横、TR/BL 竖（Z 字），无文案 presentation（与 editorial-4mix 分流）。
aesthetic: airy
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [2, 3]
  rows: [3, 2]
  gap: "3px"

photoCount: { min: 4, max: 4 }
mix: { portrait: 2, landscape: 2 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: landscape, fit: auto, visualWeight: 0.85 }
  - { index: 1, rect: [2, 2, 1, 1], role: portrait, fit: auto, visualWeight: 0.85 }
  - { index: 2, rect: [1, 1, 2, 2], role: portrait, fit: auto, visualWeight: 0.85 }
  - { index: 3, rect: [2, 2, 2, 2], role: landscape, fit: auto, visualWeight: 0.85 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  eligibility:
    heroDominance: moderate
    heroAreaBand: [0.20, 0.40]

compatibilityHints:
  prefers_burst: false
  min_trip_photos: 10

scoring:
  base_weight: 0.95
  tags: [mixed-4, chess, tpc-w3]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.07

render:
  gridClass: layout-screen__grid--mosaic-4-2l2p-weighted
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

usage:
  summary: 加权 2L2P 棋盘：Z 字横竖交错，比等分 2×2 更有杂志节奏。
  whenToUse: |
    - 窗口恰 2 横 + 2 竖、四图质量接近、不需要单一 hero 时
    - 想要非等分面积节奏又不需要 editorial 文案层时
  whenNotToUse: |
    - 需要 kicker/body 文案位时（用 screen-editorial-4mix）
    - 需要明确主次 hero 时
  designIntent: TPC W3 强化 L2P2 品味选项；与 editorial-4mix 同几何、无 presentation。
  siblings:
    - id: screen-portrait-2-landscape-2
      difference: 等分 2×2；本模板加权轨道面积不等。
    - id: screen-editorial-4mix
      difference: 同棋盘但带文案 presentation；本模板纯图。
