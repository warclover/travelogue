id: screen-mosaic-4-2l2p-weighted
version: 2
status: experimental
kind: composite
displayName: 四图 · 2L2P 等分棋盘
description: >
  TPC W3：2 横 + 2 竖的等分 2×2（各约 1/4 舞台）。
  TL/BR 横、TR/BL 竖（Z 字），无文案 presentation（与 editorial-4mix 分流）。
  狗粮验收：不等分 2:3/3:2 轨道会造成「假拼图」锯齿感，故改为等分。
aesthetic: airy
balancePolicy: equal_area

stage:
  aspect: "16:9"
  cols: [1, 1]
  rows: [1, 1]
  gap: "3px"

photoCount: { min: 4, max: 4 }
mix: { portrait: 2, landscape: 2 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: landscape, fit: cover, visualWeight: 1.0 }
  - { index: 1, rect: [2, 2, 1, 1], role: portrait, fit: cover, visualWeight: 1.0 }
  - { index: 2, rect: [1, 1, 2, 2], role: portrait, fit: cover, visualWeight: 1.0 }
  - { index: 3, rect: [2, 2, 2, 2], role: landscape, fit: cover, visualWeight: 1.0 }

constraints:
  # Equal 2×2 cells are all landscape-AR; portraits must not cover-fill them.
  portrait_forbidden_in_wide_slots: [0, 1, 2, 3]
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  eligibility:
    heroDominance: moderate
    heroAreaBand: [0.20, 0.40]

compatibilityHints:
  # false: near-scene person bursts look like a broken panorama in the chessboard
  prefers_burst: false
  min_trip_photos: 10
  avoid_near_scene_clones: true

scoring:
  # Below GA equal grids: landscape-4 (4L) and portrait-2-landscape-2 (2L2P) stay default.
  base_weight: 0.72
  tags: [mixed-4, chess, tpc-w3]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.04

render:
  gridClass: layout-screen__grid--mosaic-4-2l2p-weighted
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  # 0 until dogfood sign-off; becomes eligible when template_contract.enabled (AC-TPC-01)
  percent: 0
  zeroSince: "2026-07-20"  # LTN E1 · review within 4 weeks or promote/archive
  hash_key: tripId

usage:
  summary: 2L2P 等分 2×2：四格各约四分之一舞台，Z 字横竖交错，无文案层。
  whenToUse: |
    - 窗口恰 2 横 + 2 竖、四图质量接近、不需要单一 hero 时
    - 需要与 editorial-4mix 同混排但不需要文案位时
  whenNotToUse: |
    - 四张都是横图时（应选 screen-landscape-4）
    - 需要 kicker/body 文案位时（用 screen-editorial-4mix）
    - 需要明确主次 hero 时
  designIntent: |
    四图默认观感是等分四分之一格；不等分加权轨道在狗粮中易被读成「拼图坏了」，
    故本模板与 portrait-2-landscape-2 同为等分几何，仅槽位角色/Z 序不同。
  siblings:
    - id: screen-landscape-4
      difference: 四横等分；本模板为 2 横 + 2 竖。
    - id: screen-portrait-2-landscape-2
      difference: 同为等分 2×2；槽位角色序为 P/L/L/P，本模板为 L/P/P/L。
    - id: screen-editorial-4mix
      difference: 带文案 presentation；本模板纯图。
