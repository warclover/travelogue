id: screen-mosaic-4-1l3p-rail
version: 2
status: deprecated  # C-02 · 2026-08-28 overdue rolloutZero → archive
kind: composite
displayName: 四图 · 一横主栏 + 三竖轨
description: >
  TPC W3 混向空洞靶：L1P3。左侧约 5/6 满高横图主栏 + 右侧一列三格叠放竖图。
  v2：废弃并排三窄竖条（AR≈0.29 像切条），改为侧栏叠轨，竖图可读。
aesthetic: dense
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [5, 1]
  rows: [1, 1, 1]
  gap: "3px"
  variants:
    - { layout: web, aspect: "16:9" }
    - { layout: mobile, aspect: "9:16" }

photoCount: { min: 4, max: 4 }
mix: { portrait: 3, landscape: 1 }

slots:
  - { index: 0, rect: [1, 1, 1, 3], role: landscape, fit: cover, visualWeight: 0.95 }
  - { index: 1, rect: [2, 2, 1, 1], role: portrait, fit: cover, visualWeight: 0.75 }
  - { index: 2, rect: [2, 2, 2, 2], role: portrait, fit: cover, visualWeight: 0.75 }
  - { index: 3, rect: [2, 2, 3, 3], role: portrait, fit: cover, visualWeight: 0.75 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  eligibility:
    heroDominance: moderate
    heroAreaBand: [0.70, 0.90]

compatibilityHints:
  prefers_burst: false
  min_trip_photos: 10

scoring:
  base_weight: 1.02
  tags: [mixed, rail, tpc-w3]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.08

render:
  gridClass: layout-screen__grid--mosaic-4-1l3p-rail
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  # 0 until dogfood sign-off; becomes eligible when template_contract.enabled (AC-TPC-01)
  percent: 0
  zeroSince: "2026-07-20"  # LTN E1 · review within 4 weeks or promote/archive
  hash_key: tripId

usage:
  summary: 一横三竖轨：左满高横主图 + 右列三格叠竖，专吃 1L3P 混向窗。
  whenToUse: |
    - 窗口恰 1 横 + 3 竖，且横图适合做主场景叙事时
    - 需要打破纯竖栅格（portrait-3/4）的连排感时
  whenNotToUse: |
    - 纯竖或纯横窗口（mix 不命中）
    - 三张竖图为同一连拍近景（易呈「切条拼图」；应走单竖或 diverisify）
    - 横图为超宽全景、裁进主栏仍损地平线时
  designIntent: TPC W3 填补 L1P3 库空洞；v2 侧栏叠轨避免并排窄条假拼图。
  siblings:
    - id: screen-portrait-3
      difference: 纯三竖；本模板强制带一张横主栏。
    - id: screen-mosaic-4-hero-70-sidebar
      difference: 该模板全横 hero+侧栏；本模板右侧强制三竖。
