id: screen-mosaic-4-1l3p-rail
version: 1
status: experimental
kind: composite
displayName: 四图 · 一横主栏 + 三竖轨
description: >
  TPC W3 混向空洞靶：L1P3。左侧约半幅横图主栏 + 右侧三列满高竖图轨。
  填补 active 库无 1L3P SKU 的缺口。
aesthetic: dense
balancePolicy: weighted_tracks

stage:
  aspect: "16:9"
  cols: [3, 1, 1, 1]
  rows: [1]
  gap: "3px"
  variants:
    - { layout: web, aspect: "16:9" }
    - { layout: mobile, aspect: "9:16" }

photoCount: { min: 4, max: 4 }
mix: { portrait: 3, landscape: 1 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: landscape, fit: cover, visualWeight: 0.95 }
  - { index: 1, rect: [2, 2, 1, 1], role: portrait, fit: auto, visualWeight: 0.75 }
  - { index: 2, rect: [3, 3, 1, 1], role: portrait, fit: auto, visualWeight: 0.75 }
  - { index: 3, rect: [4, 4, 1, 1], role: portrait, fit: auto, visualWeight: 0.75 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  eligibility:
    heroDominance: moderate
    heroAreaBand: [0.40, 0.60]

compatibilityHints:
  prefers_burst: false
  min_trip_photos: 10

scoring:
  base_weight: 1.02
  tags: [mixed, rail, tpc-w3]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.08

render:
  gridClass: layout-screen__grid--mosaic-4-1l3p-rail
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

usage:
  summary: 一横三竖轨：左半幅横主图 + 右三列竖图，专吃 1L3P 混向窗。
  whenToUse: |
    - 窗口恰 1 横 + 3 竖，且横图适合做主场景叙事时
    - 需要打破纯竖栅格（portrait-3/4）的连排感时
  whenNotToUse: |
    - 纯竖或纯横窗口（mix 不命中）
    - 横图为超宽全景、裁进半幅仍损地平线时
  designIntent: TPC W3 填补 L1P3 库空洞；几何参考 portrait-1-landscape-2 反转权重。
  siblings:
    - id: screen-portrait-3
      difference: 纯三竖；本模板强制带一张横主栏。
    - id: screen-portrait-1-landscape-2
      difference: 该模板 1P2L；本模板为 1L3P 竖轨密度更高。
