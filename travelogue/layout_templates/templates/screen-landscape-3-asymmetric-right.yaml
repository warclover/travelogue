id: screen-landscape-3-asymmetric-right
version: 1
status: experimental
kind: composite
displayName: landscape · 3 · asymmetric · right
description: >
  三横 2+1：左两小叠 + 右大满高（landscape-3-editorial · V1）。
  CSS-primary：1fr | 1.7fr，舞台 16:9。
photoCount: { min: 3, max: 3 }

stage:
  aspect: "16:9"
  cols: [10, 17]
  rows: [1, 1]

mix: { portrait: 0, landscape: 3 }

slots:
  - { index: 0, rect: [1, 1, 1, 1], role: landscape, fit: cover, visualWeight: 0.75 }
  - { index: 1, rect: [1, 1, 2, 2], role: landscape, fit: cover, visualWeight: 0.75 }
  - { index: 2, rect: [2, 2, 1, 2], role: landscape, fit: cover, visualWeight: 1.0 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

scoring:
  base_weight: 0.90
  tags: [landscape-3, variant-asymmetric-right, editorial]

render:
  gridClass: layout-screen__grid--landscape-3-asym-right
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 0
  zeroSince: "2026-07-20"
  hash_key: tripId

usage:
  summary: 三横左小叠右大：辅图上下叠左，主图满高右侧。
  whenToUse: |
    - 连续 3 横，时序后/右图更强
  whenNotToUse: |
    - 只需等权 stack（应选 screen-landscape-3）
  designIntent: landscape-3-editorial · asym-right · fixed 16:9.
  siblings:
    - id: screen-landscape-3
      difference: 等权竖向 stack。
    - id: screen-landscape-3-asymmetric-left
      difference: 左右镜像。
