id: screen-portrait-2-asymmetric-right
version: 1
status: deprecated  # C-02 · 2026-08-28 overdue rolloutZero → archive
kind: primitive
displayName: portrait · 2 · asymmetric · right
description: >
  双竖右主左辅（P2VF · V1 轮换集 · 强弱选型）。
  时间序不换槽；picker 仅在右图更强时选用。两槽均为竖向显示比。
photoCount: { min: 2, max: 2 }

stage:
  aspect: "16:9"
  cols: [2, 5, 1, 5, 2]
  rows: [1, 1, 7, 1, 1]

mix: { portrait: 2, landscape: 0 }

slots:
  - { index: 0, rect: [2, 2, 3, 3], role: portrait, fit: cover, visualWeight: 0.72 }
  - { index: 1, rect: [4, 4, 2, 4], role: portrait, fit: cover, visualWeight: 1.0 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps:
    - [1, 5, 1, 1]
    - [1, 5, 5, 5]
    - [1, 1, 2, 4]
    - [3, 3, 2, 4]
    - [5, 5, 2, 4]
    - [2, 2, 2, 2]
    - [2, 2, 4, 4]

scoring:
  base_weight: 0.90
  tags: [portrait-2, variant-asymmetric-right, editorial]

render:
  gridClass: layout-screen__grid--portrait-2-asym-right
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 0
  zeroSince: "2026-07-20"
  hash_key: tripId

usage:
  summary: 双竖右主：右槽更高更重，左槽为伴（两槽均为竖向）。
  whenToUse: |
    - 窗口第二张（右）叙事/美学明显更强
    - 需要打破对称且不宜满幅
  whenNotToUse: |
    - 左图更强（应选 asymmetric-left）
    - 两图接近（应选 gallery）
    - 任一方含人物（应选 screen-portrait-2）
  designIntent: P2VF asymmetric-right · 强弱选型，不跨槽换图。
  siblings:
    - id: screen-portrait-2
      difference: 满幅等权；本模板右主留白。
    - id: screen-portrait-2-asymmetric-left
      difference: 镜像左主。
    - id: screen-portrait-2-gallery
      difference: 对称留白，无主次。
