id: screen-mosaic-5-2p3l-rail
version: 1
status: experimental
kind: composite
displayName: 五图 · 双竖满高 + 三横右栏
description: >
  TPC W3 混向空洞靶：L3P2（2P3L）。左中两列满高双竖 + 右栏三等高横图。
  复活已 deprecated 的 2p3l-equal 拓扑，带齐 usage/eligibility。
aesthetic: dense
balancePolicy: equal_height

stage:
  aspect: "16:9"
  grid: [3, 3]
  gap: "2px"
  variants:
    - { layout: web, aspect: "16:9" }
    - { layout: mobile, aspect: "9:16" }

photoCount: { min: 5, max: 5 }
mix: { portrait: 2, landscape: 3 }

slots:
  - { index: 0, rect: [1, 1, 1, 3], role: portrait, fit: cover, visualWeight: 0.95 }
  - { index: 1, rect: [2, 2, 1, 3], role: portrait, fit: cover, visualWeight: 0.95 }
  - { index: 2, rect: [3, 3, 1, 1], role: landscape, fit: cover, visualWeight: 0.70 }
  - { index: 3, rect: [3, 3, 2, 2], role: landscape, fit: cover, visualWeight: 0.70 }
  - { index: 4, rect: [3, 3, 3, 3], role: landscape, fit: cover, visualWeight: 0.70 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
  eligibility:
    heroDominance: moderate
    heroAreaBand: [0.25, 0.45]

compatibilityHints:
  prefers_burst: true
  min_trip_photos: 12

scoring:
  base_weight: 1.05
  tags: [family, mixed, 2p3l, tpc-w3]
  rhythm:
    max_per_chapter: 2
    diversity_bonus: 0.08

render:
  gridClass: layout-screen__grid--mosaic-5-2p3l-rail
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  # 0 until dogfood sign-off; becomes eligible when template_contract.enabled (AC-TPC-01)
  percent: 0
  zeroSince: "2026-07-20"  # LTN E1 · review within 4 weeks or promote/archive
  hash_key: tripId

usage:
  summary: 双竖满高 + 右三横：2P3L 无缝平铺，专吃混向五图窗。
  whenToUse: |
    - 窗口 2 竖 + 3 横，双竖适合并肩叙事（人物/细节）时
    - 需要比等分五宫更稳的竖图落位时
  whenNotToUse: |
    - 竖图不足 2 或横图不足 3
    - 需要单主图英雄页时（应选 hero / main-portrait 类）
  designIntent: TPC W3 复活 2P3L；接替 deprecated screen-mosaic-5-2p3l-equal。
  siblings:
    - id: screen-mosaic-5-2p3l-equal
      difference: 该模板已退役；本模板同拓扑但带 eligibility/usage 且 experimental 可候选。
    - id: screen-mosaic-5-main-portrait-3land
      difference: 该模板 1 竖主图 + 4 横；本模板双竖并列无单一 main。
