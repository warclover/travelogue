id: screen-editorial-4mix
version: 1
# Parked 2026-07-27 · equal 2×2 cells are landscape AR (1.778) but slots 1/2
# declare role:portrait (validator block V-P16-04). Also mix.portrait=2 conflicts
# with portrait_forbidden_in_wide_slots covering every cell. Keep YAML for
# compare/dogfood tooling; do not select for new trips until redesign.
status: deprecated
kind: composite
displayName: editorial · 4mix · chess-2L2P
description: >
  四图横竖棋盘：TL/BR 横图（各≈25% 舞台面积），TR/BL 竖图（同行等高）；
  Kicker/Body 文案区（2land 同族）；视觉 intrinsic render。
  PARKED：role/AR 矛盾 + mix vs portrait_forbidden 自相矛盾，待设计重开。
stage:
  aspect: '16:9'
  # Equal 2×2 so each tile ≈1/4 stage (dogfood: weighted tracks read as broken puzzle).
  cols:
  - 1
  - 1
  rows:
  - 1
  - 1
photoCount:
  min: 4
  max: 4
mix:
  portrait: 2
  landscape: 2
slots:
- index: 0
  rect:
  - 1
  - 1
  - 1
  - 1
  role: landscape
  fit: auto
- index: 1
  rect:
  - 2
  - 2
  - 1
  - 1
  role: portrait
  fit: auto
- index: 2
  rect:
  - 1
  - 1
  - 2
  - 2
  role: portrait
  fit: auto
- index: 3
  rect:
  - 2
  - 2
  - 2
  - 2
  role: landscape
  fit: auto
constraints:
  # Equal 2×2 cells are landscape-AR; do not cover-fill portraits into them.
  portrait_forbidden_in_wide_slots: [0, 1, 2, 3]
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
compatibilityHints:
  prefers_burst: false
  avoid_near_scene_clones: true

scoring:
  base_weight: 0.88
  tags:
  - editorial
  - mixed-4
  - chess
  - airy
  rhythm:
    max_per_chapter: 1
render:
  gridClass: layout-screen__grid--editorial-4mix
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate
  presentation: editorial-4mix
rollout:
  percent: 0
  hash_key: tripId

usage:
  summary: PARKED 四图棋盘（role/AR 矛盾待重开）；保留 YAML 供 compare 工具。
  whenToUse: |
    - 当前不选：status=deprecated（2026-07-27 park）
  whenNotToUse: |
    - Equal 2×2 cells are landscape AR 1.778 but slots 1/2 declare portrait (V-P16-04 block)
    - mix.portrait=2 conflicts with portrait_forbidden_in_wide_slots covering every cell
  designIntent: 加权轨道实现横竖棋盘而非等分 2×2；parked until redesign resolves role/AR + forbidden constraints.
  siblings:
    - id: screen-portrait-2-landscape-2
      difference: 该模板为 16:9 等分 2×2 无文案；本模板加权棋盘 + 每章限 1 次 editorial 节奏。
    - id: screen-portrait-3-editorial
      difference: 该模板三竖专屏；本模板必须 2 横 2 竖混排。
