id: screen-editorial-4mix
version: 1
status: experimental
kind: composite
displayName: editorial · 4mix · chess-2L2P
description: >
  四图横竖棋盘：TL/BR 横图（各≈25% 舞台面积），TR/BL 竖图（同行等高）；
  Kicker/Body 文案区（2land 同族）；视觉 intrinsic render。
stage:
  aspect: '16:9'
  # Equal 2×2 so each tile ≈1/4 stage (dogfood: weighted tracks read as broken puzzle).
  cols:
  - 1
  - 1
  rows:
  - 1
  - 1
photoCount:
  min: 4
  max: 4
mix:
  portrait: 2
  landscape: 2
slots:
- index: 0
  rect:
  - 1
  - 1
  - 1
  - 1
  role: landscape
  fit: auto
- index: 1
  rect:
  - 2
  - 2
  - 1
  - 1
  role: portrait
  fit: auto
- index: 2
  rect:
  - 1
  - 1
  - 2
  - 2
  role: portrait
  fit: auto
- index: 3
  rect:
  - 2
  - 2
  - 2
  - 2
  role: landscape
  fit: auto
constraints:
  # Equal 2×2 cells are landscape-AR; do not cover-fill portraits into them.
  portrait_forbidden_in_wide_slots: [0, 1, 2, 3]
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
compatibilityHints:
  prefers_burst: false
  avoid_near_scene_clones: true

scoring:
  base_weight: 0.88
  tags:
  - editorial
  - mixed-4
  - chess
  - airy
  rhythm:
    max_per_chapter: 1
render:
  gridClass: layout-screen__grid--editorial-4mix
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate
  presentation: editorial-4mix
rollout:
  # Dark-launch until dogfood / contract on (AC-TPC-01 golden stability)
  percent: 0
  hash_key: tripId
usage:
  summary: 四图横竖棋盘 + 留白呼吸：TL/BR 横图、TR/BL 竖图呈 Z 字混排，适合密度屏之后的“换口气”。
  whenToUse: |
    - 窗口恰 2 横 + 2 竖，且四张图质量接近、不需要 hero 主次时
    - 前一屏为 dense 拼图或九宫格，需要 airy 呼吸屏缓冲节奏时
    - 章内有 decorLine / 用户 voice，可填 kicker/body 文案位时（experimental）
  whenNotToUse: |
    - 窗口内有明确 hero 或需要主次分明时（应选 mosaic 主图类或 landscape-1）
    - 纯横图或纯竖图连拍（mix 硬约束不满足；纯竖走 portrait-3-editorial）
    - 章内已有 editorial 屏（rhythm max_per_chapter: 1）
  designIntent: 加权轨道实现横竖棋盘而非等分 2×2；与 portrait-2-landscape-2 相比多了节奏配额与文案预留。
  siblings:
    - id: screen-portrait-2-landscape-2
      difference: 该模板为 16:9 等分 2×2 无文案；本模板加权棋盘 + 每章限 1 次 editorial 节奏。
    - id: screen-portrait-3-editorial
      difference: 该模板三竖专屏；本模板必须 2 横 2 竖混排。
