id: screen-editorial-4mix
version: 1
status: experimental
kind: composite
displayName: editorial · 4mix · chess-2L2P
description: >
  四图横竖棋盘：TL/BR 横图（各≈25% 舞台面积），TR/BL 竖图（同行等高）；
  Kicker/Body 文案区（2land 同族）；视觉 intrinsic render。
stage:
  aspect: '16:9'
  cols:
  - 2
  - 3
  rows:
  - 3
  - 2
photoCount:
  min: 4
  max: 4
mix:
  portrait: 2
  landscape: 2
slots:
- index: 0
  rect:
  - 1
  - 1
  - 1
  - 1
  role: landscape
  fit: auto
- index: 1
  rect:
  - 2
  - 2
  - 1
  - 1
  role: portrait
  fit: auto
- index: 2
  rect:
  - 1
  - 1
  - 2
  - 2
  role: portrait
  fit: auto
- index: 3
  rect:
  - 2
  - 2
  - 2
  - 2
  role: landscape
  fit: auto
constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []
scoring:
  base_weight: 0.88
  tags:
  - editorial
  - mixed-4
  - chess
  - airy
  rhythm:
    max_per_chapter: 1
render:
  gridClass: layout-screen__grid--editorial-4mix
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate
  presentation: editorial-4mix
