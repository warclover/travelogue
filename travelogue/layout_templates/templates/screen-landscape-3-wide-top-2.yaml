id: screen-landscape-3-wide-top-2
version: 1
status: experimental
kind: composite
displayName: 三横 · 上宽幅 + 下双格
description: >
  UC-3-WIDE-TOP-2：上 1 全宽宽幅横条 + 下 2 标准横版并排（上幅宽 ≈ 下两幅之和）。
  contain 对齐；宽幅触发 AR ≥2.5:1 选版规则在 MCS 侧配置。
stage:
  aspect: "16:9"
  cols: [1, 1]
  rows: [2, 1]
  gap: "3px"

photoCount: { min: 3, max: 3 }
mix: { portrait: 0, landscape: 3 }

slots:
  - { index: 0, rect: [1, 2, 1, 1], role: landscape, fit: contain, visualWeight: 1.0 }
  - { index: 1, rect: [1, 1, 2, 2], role: landscape, fit: contain, visualWeight: 0.65 }
  - { index: 2, rect: [2, 2, 2, 2], role: landscape, fit: contain, visualWeight: 0.65 }

constraints:
  portrait_forbidden_in_wide_slots: []
  landscape_forbidden_in_tall_slots: []
  intentionalGaps: []

compatibilityHints:
  prefers_panorama: true
  min_display_aspect: 2.5

scoring:
  base_weight: 0.95
  tags: [wide_top, contain_stack]

render:
  gridClass: layout-screen__grid--landscape-3-wide-top-2
  cssBundle: journal-screens.css
  fitPolicy: auto_delegate

rollout:
  percent: 100
  hash_key: tripId

_legacy:
  accepts:
    min_portrait: 0
    min_landscape: 3
    max_portrait: 0
    max_landscape: 3
  css_verified: true
