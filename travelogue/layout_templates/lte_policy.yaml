# LTE registry policy (PRD §4.2, R-P16-02)
# W0 skeleton — quotas enforced in W1 registry loader.

registry_version: p16-2026-06

# MCS unified window families (exported to _legacy_generated.py · R-P16-02)
mosaic_unified_groups:
  # LTN C3 / D8 · active set 11 (3+4+2+2); pruned 6/8/9 flat grids stay in YAML as deprecated.
  MOSAIC_3_PATTERN_IDS:
    - screen-portrait-3
    # screen-portrait-3-editorial · beta primitive · planner hook only (PRD portrait-row-editorial)
    - screen-landscape-3
    - screen-portrait-1-landscape-2
  MOSAIC_4_PATTERN_IDS:
    - screen-portrait-2-landscape-2
    - screen-portrait-4
    - screen-landscape-4
    - screen-mosaic-4-hero-70-sidebar
  MOSAIC_5_PATTERN_IDS:
    - screen-mosaic-5-main-portrait-3land
    - screen-mosaic-5-hero-3-2-plus-4   # MCR · D4 · 行为等价，消除 orphan
  MOSAIC_6_PATTERN_IDS:
    - screen-mosaic-5-main-hero-plus-4
    - screen-mosaic-6-main-hero-plus-5
  MOSAIC_8_PATTERN_IDS: []
  MOSAIC_9_PATTERN_IDS: []

quotas:
  5:
    # 2 GA + experimental mosaic-5 SKUs (incl. 3P2L soft family pair)
    max_active_composite: 8
    max_active_total: 12
  9:
    max_active_primitive: 2
    max_active_total: 4

# Emergency disable without editing template YAML (R-P16-08) — runtime config mirror:
# layout.template_engine.overrides.disable:
#   - screen-mosaic-5-2p3l-equal
#
# Roll back hero-3-2-plus-4 v4 geometry guard (Plate 63 fix) without reverting YAML:
# mosaic.hero_weighted_geometry_guard: false

# §9.4 exposure debt controller (proposal-only; requires config_governance approval)
exposure_control:
  damping: 0.5
  min_weight: 0.5
  max_weight: 2.0

# MCS ↔ LTE integration (§9.4 candidate diversity)
mcs_integration:
  scoring:
    diversity:
      mode: mmr
      lambda: 0.65
