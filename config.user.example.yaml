# Travelogue · 用户档配置样例（CSC W3b · L0 + L1）
# 复制为 config.yaml 并勿提交到 Git。
#
# 本文件只列「安装/成册结果」相关键：
#   L0 运维根 — 目录、写作引擎、地理编码占位
#   L1 结果旋钮 — ≤10（当前 3；见 docs/acceptance-records/csc-w0-l0-l1-keys.md）
#
# 深参、实验旗标、杂志算法细节 → 见 config.yaml.example（research 面），
# 或依赖 AppConfig 代码默认；勿把 research 键抄进用户档「常用」。

trips_dir: ./trips

# --- L0 · 运维根（默认不进 Studio「常用」设置）---
# 智能动作总闸：填了 API Key 仍不够；须显式开启，否则预览 AI 显示「智能动作暂不可用」。
# 等价环境变量：TRAVELOGUE_AI_SURFACE=1
studio:
  ai_surface_enabled: true        # false=默认无 AI 面（NAS）；true=开启杂志文案/封面字体等
  output_ledger: true             # OLT · 成品账本；发布默认 true，false 回退现网

llm:
  provider: stub                  # stub | deepseek | dashscope
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY   # 密钥写项目根 .env，勿提交
  timeout_sec: 120

ffmpeg:
  path: ffmpeg

geocode:
  enabled: false
  provider: null
  api_key_env: null

# --- L1 · 结果旋钮（预算 ≤10 · 当前 3）---
clustering:
  enabled: auto                   # auto | true | false · 行程识别

vision:
  enabled: false                  # 场景分析；开则更慢

ingest:
  copy_source_files: true         # 导入时复制源文件

# --- 封面装帧标题（复制到 config.yaml 后按需改）---
title_art:
  enabled: true                   # 总闸：Studio「封面版式」下显示「生成装帧标题」
  route_c_enabled: true           # 显示「优先 AI 手写体」勾选（默认勾选；可取消）
                                  # （未勾选 / 校验失败 → 静默回退字库合成默认样式）

# 其余能力（bookends / curate / layout / aesthetic / …）使用代码默认，
# 不在用户档展开。需要研究调试时再对照 config.yaml.example。
