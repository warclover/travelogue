# PA · 照片审美评价体系 — 配置示例（阶段 PA-1 · 路径 A · 零依赖）
#
# 把 aesthetic 段落合并进项目根目录的 config.yaml 即可生效。
# 关闭总开关（enabled: false）后 ingest 回退到旧行为，不写 quality.aesthetic。

aesthetic:
  enabled: true              # Layer 1 总开关（路径 A）
  source: rules              # rules | rules+ml | mllm（PA-1 仅 rules）

  # overall = Σ wᵢ·dimᵢ（自动按权重和归一）
  weights:
    composition: 0.25
    exposure: 0.20
    color: 0.20
    lighting: 0.15
    subjectClarity: 0.20

  thumb_px: 32              # 共享灰度缩略图边长（与 ingest 色彩缩略图一致）

  # PA-4 · 路径 B：curate 阶段用 topiq 校准 overall（需 pyiqa+torch；默认关）
  ml_calibrate: false        # true → overall = (1-blend)·rules + blend·topiq
  ml_calibrate_blend: 0.4    # 默认 0.6·rules + 0.4·topiq；设备/指标沿用 cull.*
  use_purpose_presets: true  # cover/hero/solo 各用不同 weights 预设

  presets:                   # 可选 · 覆盖默认用途权重
    cover:
      composition: 0.30
      color: 0.25
    hero:
      composition: 0.28
      subjectClarity: 0.25
    solo:
      lighting: 0.28
      composition: 0.22
