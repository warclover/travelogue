# Landscape-2 editorial dogfood — copy into local config.yaml (gitignore).
# Dual switch: landscape_2_editorial.enabled AND template_experiments.

layout:
  landscape_2_editorial:
    enabled: true
    recent_window: 2
    repeat_penalty: 0.55
    strength_tie_epsilon: 0.08

mosaic:
  template_experiments:
    enabled: true
    allowlist:
      # overlap-tlbr / overlap-bltr currently disabled in root config.yaml
      - screen-landscape-2-asymmetric-left
    cohort_trip_ids:
      - your-dogfood-trip-id
