role: diag-2l4p-wide

stage:
  aspect: "16:9"
  # 竖槽 3:4 宽 18.75%。宽横 16:9，示意图写 40.6%，按 40.625%（13/32）落槽。
  # 上行顶齐，下行底齐。两行竖槽高 8/9，顶 / 行缝 / 底各 1/27 不动。
  # 每行两道列缝令牌 1.5%；余宽归左右纸边各 9.4375%。
  # 上：两竖 + 右宽横；下：左宽横 + 两竖（对角）。
  margin:
    top: 0.037037
    right: 0.094375
    bottom: 0.037037
    left: 0.094375
  gapX: 0.015
  gapY: 0.037037
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 6
mix: { portrait: 4, landscape: 2 }

placement:
  groupAlign: center
  distribute: diag-wide-land-port-rows

slots:
  - { index: 0, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 1, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 2, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 3, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 4, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 5, role: portrait, orient: portrait, aspect: "3:4" }

copyRegions: []

admit:
  perSlot: true
  # 竖槽：禁横，优先 3:4
  # 横槽：禁竖，优先 16:9

themes: [portrait, landscape, sequence, food]
usage:
  whenToUse: 两张 16:9 宽横对角，四张竖图分行填；连拍里夹两张宽横
  whenNotToUse: 横是 4:3 且叠在一侧 → 用 page-6-2l4p-left；对角但是 4:3 横 + 六竖 → 用 page-8-2l6p；要左右对调 → 用 page-6-2l4p-wide-flip

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更宽则以宽对齐、高度向下留白」（顶齐）。本库仍走相对槽三条。

glyph:
  badge: 2P1L
  thumb: 上两竖 18.75% + 右宽横 40.625%；下左宽横 + 两竖；上行顶齐、下行底齐

sourceSketch: sketch.png

