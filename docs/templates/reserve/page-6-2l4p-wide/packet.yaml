id: page-6-2l4p-wide
version: 1
status: sketch
kind: primitive
displayName: 上两竖一宽横下一宽横两竖
sketchName: 4竖2横宽幅
familyId: mix-2l4p-wide
canonical: page-6-2l4p-wide
related: [page-6-2l4p-wide-flip]
