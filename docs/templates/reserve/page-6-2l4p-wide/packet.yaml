#   landW = 0.40625 W（示意图 40.6%）；16:9 → landH = 0.40625 H
#   列缝 1.5%；左右纸边各 0.094375 W
#   上两竖 left 0.094375 / 0.296875；上横 left 0.499375，top 1/27
#   下横 left 0.094375，top 0.556713（与下两竖底齐）
#   下两竖 left 0.515625 / 0.718125，top 14/27
