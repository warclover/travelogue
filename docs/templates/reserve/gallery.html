<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>备用页型库 · 微缩</title>
  <style>
    :root {
      --ink: #ece8e0;
      --muted: #8a8278;
      --paper: #0e0d0c;
      --card: #1a1917;
      --line: #2a2824;
      --gold: #b8923a;
      --port: #c45c4a;
      --land: #3d6b8a;
      --copy: #3d7a4a;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: #121110;
      color: var(--ink);
    }
    header {
      position: sticky; top: 0; z-index: 4;
      background: #0d0c0b;
      padding: 14px 20px 16px;
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 15px; font-weight: 650; }
    header h1 em { font-style: normal; color: var(--gold); font-weight: 400; }
    header p { margin: 6px 0 0; font-size: 12px; color: var(--muted); max-width: 92ch; line-height: 1.55; }
    header a { color: var(--gold); }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }
    .swatch.p { background: var(--port); }
    .swatch.l { background: var(--land); }
    .swatch.s { background: var(--gold); }
    .swatch.copy { background: var(--copy); }
    main { padding: 18px 20px 64px; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin: 0 0 16px;
    }
    .toolbar button {
      font: inherit; font-size: 12px; color: var(--ink);
      background: #0e0d0c; border: 1px solid var(--line);
      border-radius: 4px; padding: 5px 10px; cursor: pointer;
    }
    .toolbar button[aria-pressed="true"] {
      border-color: var(--gold); color: var(--gold);
    }
    .toolbar .sep {
      width: 1px; height: 16px; background: var(--line); margin: 0 4px;
    }
    .toolbar button .n {
      color: var(--muted); font-variant-numeric: tabular-nums;
    }
    .toolbar button[aria-pressed="true"] .n { color: var(--gold); }
    .card.is-core { border-color: #5a4a28; }
    .star-pick { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; flex-shrink: 0; }
    .star-pick button {
      font: inherit; font-size: 11px; line-height: 1;
      color: var(--muted); background: #0e0d0c;
      border: 1px solid var(--line); border-radius: 4px;
      padding: 3px 7px; cursor: pointer;
    }
    .star-pick button[aria-pressed="true"] {
      border-color: var(--gold); color: var(--gold);
    }
    .banner {
      display: none; align-items: center; gap: 10px; flex-wrap: wrap;
      margin: 0 0 14px; padding: 8px 10px;
      border: 1px solid #5a4a28; border-radius: 6px;
      font-size: 12px; color: var(--gold);
    }
    .banner.is-on { display: flex; }
    .banner button {
      font: inherit; font-size: 12px; color: var(--gold);
      background: #0e0d0c; border: 1px solid var(--gold);
      border-radius: 4px; padding: 4px 10px; cursor: pointer;
    }
    .group { margin: 0 0 28px; }
    .group h2 {
      margin: 0 0 10px;
      font-size: 13px; font-weight: 650;
    }
    .group h2 small {
      color: var(--gold); font-weight: 500; margin-left: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }
    .stage {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--paper);
      border: 2px solid #111;
      outline: 1px solid #3a3834;
      position: relative;
      overflow: hidden;
    }
    .region {
      position: absolute;
      border: 2px solid currentColor;
      background: color-mix(in srgb, currentColor 18%, transparent);
    }
    .region.slot.p { color: var(--port); }
    .region.slot.l { color: var(--land); }
    .region.slot.s { color: var(--gold); }
    .region.copy { color: var(--copy); }
    .region.copy.is-empty {
      border-style: dashed;
      background: transparent;
      opacity: 0.35;
    }
    .badge {
      position: absolute; right: 6px; bottom: 6px;
      font-size: 10px; font-weight: 700; letter-spacing: .04em;
      background: #0e0d0c; color: #fff; border-radius: 3px; padding: 2px 5px;
    }
    .meta { padding: 10px 2px 2px; }
    .id-row { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .id-row code { font-size: 12px; color: #ece8e0; word-break: break-all; }
    .name { margin: 4px 0 0; font-size: 13px; }
    .blurb, .links { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .links a { color: var(--gold); }
    .note {
      margin: 8px 0 0;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }
  </style>
</head>

  </header>

    const STORE_KEY = "reserve-stars-draft-v1";
    const SEED = {
      "page-2-pair-port": 3,
      "page-2-pair-land": 3,
      "page-2-1l1p-wide": 3,
      "page-3-port": 3,
      "page-3-2l1p-left": 3,
      "page-4-grid-land": 3,
      "page-3-2p1s": 3
    };

    const board = document.getElementById("board");
    const filtersEl = document.getElementById("filters");
    const starFiltersEl = document.getElementById("star-filters");
    const toggle = document.getElementById("toggle-copy");
    const banner = document.getElementById("star-banner");
    let showCopy = true;
    let slotFilter = 0;
    let starFilter = -1;
    let fileStars = {};
    let liveStars = {};

    function parseStarsYaml(text) {
      const out = {};
      for (const raw of String(text).split(/\r?\n/)) {
        const line = raw.trim();
        if (!line || line.startsWith("#")) continue;
        const m = /^([a-z0-9-]+):\s*([0-3])\s*$/.exec(line);
        if (m) out[m[1]] = Number(m[2]);
      }
      return out;
    }

    function serializeStarsYaml(map) {
      const ids = FACES.map((f) => f.id).filter((id) => (map[id] || 0) > 0);
      ids.sort((a, b) => (map[b] - map[a]) || a.localeCompare(b));
      const lines = [
        "# 备用库星级 · 权威。未列出 = 0。镜像不自动继承。",
        "# 0 无星 · 1 · 2 · 3 最常用",
        "# 在 gallery.html 点星后用「写入本库」覆盖本文件。",
        ""
      ];
      for (const id of ids) lines.push(`${id}: ${map[id]}`);
      return `${lines.join("\n")}\n`;
    }

    function cloneStars(map) {
      return { ...map };
    }

    function isDirty() {
      return serializeStarsYaml(liveStars) !== serializeStarsYaml(fileStars);
    }

    function persistDraft() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ stars: liveStars, file: fileStars }));
      } catch (_) { /* ignore quota */ }
    }

    function faceStars(face) {
      return liveStars[face.id] || 0;
    }

    function setStars(id, n) {
      const cur = liveStars[id] || 0;
      const next = n === 0 || n === cur ? 0 : n;
      if (next) liveStars[id] = next;
      else delete liveStars[id];
      persistDraft();
      render();
    }

    function starText(n) {
      return n ? "★".repeat(n) : "无星";
    }

    async function loadStars() {
      let fromFile = null;
      try {
        const res = await fetch("./stars.yaml", { cache: "no-store" });
        if (res.ok) fromFile = parseStarsYaml(await res.text());
      } catch (_) { /* file:// 常读不到 */ }
      fileStars = fromFile || cloneStars(SEED);
      liveStars = cloneStars(fileStars);
      try {
        const draft = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (draft && draft.stars && typeof draft.stars === "object") {
          const fileSame = serializeStarsYaml(draft.file || {}) === serializeStarsYaml(fileStars);
          if (fileSame) liveStars = cloneStars(draft.stars);
        }
      } catch (_) { /* ignore bad draft */ }
    }

    async function saveStars() {
      const text = serializeStarsYaml(liveStars);
      try {
        if (window.showSaveFilePicker) {
          const handle = await window.showSaveFilePicker({
            suggestedName: "stars.yaml",
            id: "reserve-stars",
            types: [{ description: "YAML", accept: { "text/yaml": [".yaml"], "text/plain": [".yaml"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(text);
          await writable.close();
          fileStars = cloneStars(liveStars);
          persistDraft();
          render();
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
      const blob = new Blob([text], { type: "text/yaml" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "stars.yaml";
      a.click();
      URL.revokeObjectURL(a.href);
      fileStars = cloneStars(liveStars);
      persistDraft();
      render();
    }

    function slotCount(face) {
      if (face.slots) return face.slots.length;
      if (face.slot) return 1;
      return 0;
    }

    function pct(box) {
      return `left:${box.left}%;top:${box.top}%;width:${box.width}%;height:${box.height}%`;
    }

    function slotOrient(box) {
      if (box.orient === "landscape" || box.orient === "portrait" || box.orient === "square") {
        return box.orient === "landscape" ? "l" : box.orient === "portrait" ? "p" : "s";
      }
      const ratio = (box.width / box.height) * (16 / 9);
      if (ratio > 1.08) return "l";
      if (ratio < 0.92) return "p";
      return "s";
    }

    function cardHtml(face) {
      const copyBoxes = face.copies || (face.copy ? [face.copy] : []);
      const slotBoxes = face.slots || (face.slot ? [face.slot] : []);
      const copyClass = showCopy ? "region copy" : "region copy is-empty";
      const copyHtml = copyBoxes.map((box) => `<div class="${copyClass}" style="${pct(box)}"></div>`).join("");
      const slotHtml = slotBoxes.map((box) => `<div class="region slot ${slotOrient(box)}" style="${pct(box)}"></div>`).join("");
      const n = faceStars(face);
      const cardClass = n === 3 ? "card is-core" : "card";
      const pick = [0, 1, 2, 3].map((k) =>
        `<button type="button" data-star="${k}" aria-pressed="${n === k}">${k ? "★".repeat(k) : "无"}</button>`
      ).join("");
      return `
        <article class="${cardClass}">
          <div class="stage" aria-label="${face.id}">
            ${copyHtml}
            ${slotHtml}
            <span class="badge">${face.badge}</span>
          </div>
          <div class="meta">
            <div class="id-row">
              <code>${face.id}</code>
              <div class="star-pick" data-id="${face.id}">${pick}</div>
            </div>
            <p class="name">${face.displayName}</p>
            <p class="blurb">${face.blurb}</p>
            <p class="links">
              <a href="${face.href}packet.yaml">数据包</a> ·
              <a href="${face.href}USAGE.md">使用说明</a>${face.hasSketch === false ? "" : ` · <a href="${face.href}sketch.png">示意图</a>`}
            </p>
            <p class="note">${face.related}<br>${face.replaces}</p>
          </div>
        </article>`;
    }

    function countsBySlot() {
      const map = new Map();
      for (const face of FACES) {
        const n = slotCount(face);
        map.set(n, (map.get(n) || 0) + 1);
      }
      return [...map.entries()].sort((a, b) => a[0] - b[0]);
    }

    function visibleFaces() {
      return FACES.filter((f) => {
        if (slotFilter && slotCount(f) !== slotFilter) return false;
        if (starFilter >= 0 && faceStars(f) !== starFilter) return false;
        return true;
      });
    }

    function readHash() {
      const mSlots = /(?:^|#|&)slots=(\d+)/.exec(location.hash);
      const mStars = /(?:^|#|&)stars=(\d+)/.exec(location.hash);
      slotFilter = mSlots ? Number(mSlots[1]) : 0;
      starFilter = mStars ? Number(mStars[1]) : -1;
    }

    function writeHash() {
      const parts = [];
      if (slotFilter) parts.push(`slots=${slotFilter}`);
      if (starFilter >= 0) parts.push(`stars=${starFilter}`);
      const next = parts.length ? `#${parts.join("&")}` : "#";
      if (location.hash !== next) history.replaceState(null, "", next);
    }

    function renderFilters() {
      const counts = countsBySlot();
      const allN = FACES.length;
      const chips = [
        { n: 0, label: `全部 <span class="n">${allN}</span>` },
        ...counts.map(([n, c]) => ({ n, label: `${n} 张 <span class="n">${c}</span>` }))
      ];
      filtersEl.innerHTML = chips.map((chip) =>
        `<button type="button" data-slots="${chip.n}" aria-pressed="${slotFilter === chip.n}">${chip.label}</button>`
      ).join("");
      const starCounts = [0, 1, 2, 3].map((n) => [n, FACES.filter((f) => faceStars(f) === n).length]);
      const starChips = [
        { n: -1, label: "星级全部" },
        ...starCounts.filter(([, c]) => c).map(([n, c]) => ({
          n,
          label: `${starText(n)} <span class="n">${c}</span>`
        }))
      ];
      starFiltersEl.innerHTML = starChips.map((chip) =>
        `<button type="button" data-stars="${chip.n}" aria-pressed="${starFilter === chip.n}">${chip.label}</button>`
      ).join("");
    }

    function render() {
      toggle.setAttribute("aria-pressed", showCopy ? "true" : "false");
      toggle.textContent = showCopy ? "文案：有字" : "文案：没字（槽位不动）";
      banner.classList.toggle("is-on", isDirty());
      renderFilters();
      const shown = visibleFaces();
      const groups = countsBySlot()
        .map(([n]) => ({
          n,
          faces: shown.filter((f) => slotCount(f) === n).sort((a, b) => faceStars(b) - faceStars(a))
        }))
        .filter((g) => g.faces.length);
      board.innerHTML = groups.map((g) => `
        <section class="group">
          <h2>${g.n} 张<small>${g.faces.length} 面</small></h2>
          <div class="grid">${g.faces.map(cardHtml).join("")}</div>
        </section>`).join("");
    }

    filtersEl.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-slots]");
      if (!btn) return;
      slotFilter = Number(btn.dataset.slots);
      writeHash();
      render();
    });
    starFiltersEl.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-stars]");
      if (!btn) return;
      starFilter = Number(btn.dataset.stars);
      writeHash();
      render();
    });
    board.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-star]");
      if (!btn) return;
      const pick = btn.closest("[data-id]");
      if (!pick) return;
      setStars(pick.dataset.id, Number(btn.dataset.star));
    });
    document.addEventListener("click", (ev) => {
      if (ev.target.closest(".js-save-stars")) saveStars();
    });
    toggle.addEventListener("click", () => {
      showCopy = !showCopy;
      render();
    });
    window.addEventListener("hashchange", () => {
      readHash();
      render();
    });
    readHash();
    loadStars().then(render);
  </script>
