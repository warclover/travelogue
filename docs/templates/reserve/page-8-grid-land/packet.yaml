# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-8-grid-land
version: 1
status: sketch
kind: primitive
displayName: 横版八宫格
sketchName: 横版八宫格
familyId: land-grid
canonical: page-8-grid-land
related: [page-4-grid-land, page-6-grid-land]
seeAlso: [page-4-port, page-9-grid-land-wide]
replaces: null
aliases: []
program: grid
densityClass: dense
role: grid-8-land

stage:
  aspect: "16:9"
  # 单槽 4:3，宽 25% 页宽，四列贴边无横缝。
  # 4:3 → 高 = 1/3 页高。两行占 2/3，剩余 1/3 三等分（顶/缝/底）= 1/9。
  margin:
    top: 0.111111
    right: 0
    bottom: 0.111111
    left: 0
  gapX: 0
  gapY: 0.111111
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 8
mix: { portrait: 0, landscape: 8 }

placement:
  groupAlign: center
  distribute: even-grid
  columns: 4
  rows: 2

slots:
  - { index: 0, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 1, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 2, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 3, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 4, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 5, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 6, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 7, role: landscape, orient: landscape, aspect: "4:3" }

copyRegions: []

admit:
  forbidOrient: [portrait]
  requireOrient: [landscape]
  preferAspect: "4:3"

themes: [landscape, food, pet, sequence]
usage:
  whenToUse: 八张 4:3 横图 4×2 等权并置；适合美食与宠物连拍
  whenNotToUse: 只要四张 → 用 page-4-grid-land；只要六张 → 用 page-6-grid-land；必须消化竖图

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更宽则以宽对齐、高度向下留白」（顶齐）。本库仍走相对槽三条。

glyph:
  badge: 8L
  thumb: 4×2 横槽 4:3；单槽宽 25% 贴边无横缝；剩余高三等分

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 4:3）---
#   slotW = 1/4 W；四列贴边，gapX = 0
#   slotH = (1/4) × (16/9) × (3/4) H = 1/3 H
#   剩余高 1/3 → 顶/缝/底各 1/9
#   列 left: 0 / 1/4 / 1/2 / 3/4
#   行 top:  1/9 / 5/9
# 左右对称，无镜像兄弟。
# 不是 page-4-grid-land（那边是 2×2、有左右边距）。
# 现网 screen-portrait-grid-8 是 9:16 八竖 4×2，不是同一张。
# 无合格现网横版八宫顶岗。
