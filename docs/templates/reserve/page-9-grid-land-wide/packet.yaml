# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-9-grid-land-wide
version: 1
status: sketch
kind: primitive
displayName: 宽幅九宫格
sketchName: 宽幅九宫格
familyId: land-grid
canonical: page-9-grid-land-wide
related: [page-4-grid-land-wide, page-3-land]
seeAlso: [page-4-grid-land, page-1-hero-land-wide]
replaces: screen-landscape-9
aliases: []
program: grid
densityClass: dense
role: grid-9-land-wide

stage:
  aspect: "16:9"
  # 单槽 16:9，高 30% 页高 → 宽亦 30% 页宽。
  # 只收列缝 2.5% → 1.5%；行缝仍 2.5%（已接近令牌等价页高，不改竖向）。
  margin:
    top: 0.025
    right: 0.035
    bottom: 0.025
    left: 0.035
  gapX: 0.015
  gapY: 0.025
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 9
mix: { portrait: 0, landscape: 9 }

placement:
  groupAlign: center
  distribute: even-grid
  columns: 3
  rows: 3

slots:
  - { index: 0, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 1, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 2, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 3, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 4, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 5, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 6, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 7, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 8, role: landscape, orient: landscape, aspect: "16:9" }

copyRegions: []

admit:
  forbidOrient: [portrait]
  requireOrient: [landscape]
  preferAspect: "16:9"

themes: [landscape, architecture, sequence]
usage:
  whenToUse: 九张 16:9 横图 3×3 等权并置
  whenNotToUse: 只要四张 → 用 page-4-grid-land-wide；必须消化竖图；需要一张明显英雄

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更宽则以宽对齐、高度向下留白」（顶齐）。本库仍走相对槽三条。

glyph:
  badge: 9L
  thumb: 3×3 横槽 16:9；单槽高 30%；列缝 1.5%；行缝仍 2.5%

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 16:9）---
#   slotH = 0.3 H；16:9 纸上 16:9 槽 → slotW = 0.3 W
#   缝令牌 gapX = 0.015；余宽 0.10 − 0.03 = 0.07 → 左右纸边各 0.035
#   列 left: 0.035 / 0.35 / 0.665（中列不动）
#   行 top:  0.025 / 0.35 / 0.675（竖向不动）
# 左右对称，无镜像兄弟。
# 不是 page-4-grid-land-wide（那边是 2×2、单槽 7/16）。
# 现网 screen-landscape-9 是 16:9 九横 3×3（文档已 deprecated），边距未必同本稿。
