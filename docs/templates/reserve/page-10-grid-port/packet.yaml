id: page-10-grid-port
version: 1
status: sketch
kind: primitive
displayName: 竖版十宫格
sketchName: 10竖
familyId: portrait-grid
canonical: page-10-grid-port
related: [page-8-grid-port, page-4-port, page-5-1p4p-left]
seeAlso: [page-8-grid-land, page-4-2p2p]
replaces: null
aliases: []
program: grid
densityClass: dense
role: grid-10-port

stage:
  aspect: "16:9"
  # 单槽 3:4，宽 18.75%（与 page-5-1p4p-left 小竖同尺寸）。
  # 5 列 × 2 行。余宽 6.25% 六等分（左 / 四缝 / 右）。
  # 两行高 8/9，余高 1/9 三等分（顶 / 行缝 / 底）各 1/27。
  margin:
    top: 0.037037
    right: 0.010417
    bottom: 0.037037
    left: 0.010417
  gapX: 0.010417
  gapY: 0.037037
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 10
mix: { portrait: 10, landscape: 0 }

placement:
  groupAlign: center
  distribute: even-grid
  columns: 5
  rows: 2

slots:
  - { index: 0, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 1, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 2, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 3, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 4, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 5, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 6, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 7, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 8, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 9, role: portrait, orient: portrait, aspect: "3:4" }

copyRegions: []

admit:
  forbidOrient: [landscape]
  requireOrient: [portrait]
  preferAspect: "3:4"

themes: [portrait, pet, food, sequence]
usage:
  whenToUse: 十张 3:4 竖图 5×2 等权并置；连拍 / 序列
  whenNotToUse: 只要四竖 → 用 page-4-port；只要八竖 → 用 page-8-grid-port；必须消化横图

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐、左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更高则以高对齐、左右留白」。本库仍走相对槽三条。

glyph:
  badge: 10P
  thumb: 5×2 竖槽 3:4 各宽 18.75%；余宽六等分；顶/行缝/底各 1/27

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 3:4）---
#   slotW = 0.1875 W；slotH = 4/9 H
#   余宽 1 − 5×0.1875 = 0.0625 / 6 = 1/96
#   列 left: 1/96 / 5/24 / 13/32 / 29/48 / 77/96
#   行 top:  1/27 / 14/27
# 左右对称，无镜像兄弟。
# 现网 screen-portrait-grid-8 是 9:16 八竖，不是同一张。
