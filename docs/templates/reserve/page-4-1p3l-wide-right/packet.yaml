  # 列缝令牌 1.5%；余宽左右均分各 3.625%。左栏顶底与竖槽齐，栏内行缝由齐边反推。
  margin:
    top: 0.055556
    right: 0.03625
    bottom: 0.055556
    left: 0.03625
  gapX: 0.015
