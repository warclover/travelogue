  groupAlign: center
  distribute: split-left-1l2l-right-port

slots:
  - { index: 0, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 1, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 2, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 3, role: main, orient: portrait, aspect: "3:4" }

copyRegions: []

admit:
  perSlot: true
  # 竖槽：禁横，优先 3:4
  # 上横：禁竖，优先 16:9
  # 下两横：禁竖，优先 4:3

themes: [portrait, landscape, architecture, sequence]
usage:
  whenToUse: 一张竖图为主靠右，左上一条 16:9 宽横、左下两张 4:3
  whenNotToUse: 三横都是 4:3 且上二下一 → 用 page-4-1p3l-right；竖图更适合靠左 → 用 page-4-1p3l-wide-left；只要两横一竖

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写 4:3 进 16:9 槽要裁。本库仍走相对槽三条；朝向不符禁入。

glyph:
  badge: 3L1P
  thumb: 左上 16:9 宽 53.75%；左下两横 4:3 各 25%；右竖 3:4 高 8/9；列缝 1.5%

sourceSketch: sketch.png

# --- 几何（16:9 纸）---
#   portW = 0.375 W；portH = 8/9 H；portTop = 1/18 H；portLeft = 0.58875 W
#   wideW = 0.5375 W；16:9 → wideH = 0.5375 H；wideLeft = 0.03625 W
#   smallW = 0.25 W；4:3 → smallH = 1/3 H
#   两小外沿与上横左右齐 → 中缝 = 0.5375 − 0.5 = 0.0375 W
#   左栏顶底与竖槽齐 → 行缝 = 8/9 − 0.5375 − 1/3 = 0.018056 H
#   列缝 1.5%；左右纸边各 0.03625 W
