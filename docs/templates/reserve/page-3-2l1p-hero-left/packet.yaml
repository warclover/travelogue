id: page-3-2l1p-hero-left
version: 1
status: sketch
kind: primitive
displayName: 左主横右上横下竖
sketchName: 2横1竖1主
familyId: land-hero-stack
canonical: page-3-2l1p-hero-left
related: [page-3-2l1p-hero-right]
seeAlso: [page-3-2l1p-left, page-3-1s2l-left, page-2-1l1p]
replaces: null
aliases: []
program: mosaic
densityClass: standard
role: land-hero-l

stage:
  aspect: "16:9"
  # 主图 4:3 = 页宽 71%；右栏 25%。剩余 4% 作列缝（示意图写留白）。
  # 左右贴边。两列等高：主图按 4:3 定高，右栏两槽按槽比求解后，缝补齐。
  margin:
    left: 0
    right: 0
  gapX: 0.04
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 3
mix: { portrait: 1, landscape: 2 }

placement:
  groupAlign: center
  distribute: split-left-land-right-stack-lp

slots:
  - { index: 0, role: main, orient: landscape, aspect: "4:3" }
  - { index: 1, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 2, role: portrait, orient: portrait, aspect: "3:4" }

copyRegions: []

admit:
  perSlot: true
  # 横槽：禁竖，优先 4:3
  # 竖槽：禁横，优先 3:4

themes: [landscape, portrait, architecture, sequence]
usage:
  whenToUse: 一张 4:3 横图明显更大，右上再辅一张横、右下辅一张竖
  whenNotToUse: 竖图才是主图 → 用 page-3-2l1p-left；主横更适合靠右 → 用 page-3-2l1p-hero-right；三张等权

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁

glyph:
  badge: 2L1P
  thumb: 左主 4:3 占页宽 71%；右上横 4:3、右下竖 3:4 各占 25%；列缝 4%

sourceSketch: sketch.png

# --- 几何（16:9 纸）---
#   mainW = 0.71 W；4:3 → mainH = 0.71 * (3/4) W = 0.5325 W = 0.946667 H
#   mainLeft = 0；mainTop = (1 - 0.946667) / 2 = 0.026667 H
#   colLeft = 0.71 + 0.04 = 0.75 W；colW = 0.25 W
#   landH = 0.25 * (3/4) W = 0.1875 W = 0.333333 H
#   portH = 0.25 * (4/3) W = 0.333333 W = 0.592593 H
#   gapY  = 0.946667 - 0.333333 - 0.592593 = 0.020741 H  （补齐两列等高）
#   landTop = 0.026667 H
#   portTop = 0.026667 + 0.333333 + 0.020741 = 0.380741 H
# 与 page-3-2l1p-left（竖主满高 + 右双横叠）不是同一张。
