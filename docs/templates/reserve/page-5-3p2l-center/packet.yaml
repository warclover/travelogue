# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-5-3p2l-center
version: 1
status: sketch
kind: primitive
displayName: 中大竖左上竖右上横
sketchName: 3竖2横
familyId: port-land-center
canonical: page-5-3p2l-center
related: [page-5-3p2l-center-flip]
seeAlso: [page-5-3p2l-left, page-5-3p2l-stack-left]
replaces: screen-mosaic-5-2p3l-portrait-hero-rail
aliases: []
program: mosaic
densityClass: standard
role: port-center-stagger

stage:
  aspect: "16:9"
  # 中大竖 3:4 高 8/9，垂直居中。左右列各宽 25%，上下与大竖顶底齐。
  # 左列上 3:4、下 16:9；右列上 16:9、下 3:4。列内缝仍 5/108（对齐反推，不改）。
  # 列缝令牌 1.5%；余宽不再四等分，左右纸边各 4.75%。中竖 left 不动。
  margin:
    top: 0.055556
    right: 0.0475
    bottom: 0.055556
    left: 0.0475
  gapX: 0.015
  gapY: 0.046296
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 5
mix: { portrait: 3, landscape: 2 }

placement:
  groupAlign: center
  distribute: split-left-stack-center-port-right-stagger

slots:
  - { index: 0, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 1, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 2, role: main, orient: portrait, aspect: "3:4" }
  - { index: 3, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 4, role: portrait, orient: portrait, aspect: "3:4" }

copyRegions: []

admit:
  perSlot: true
  # 竖槽：禁横，优先 3:4
  # 横槽：禁竖，优先 16:9

themes: [portrait, landscape, architecture, sequence]
usage:
  whenToUse: 一张大竖居中，左右列横竖交错（左上小竖、右上宽横）
  whenNotToUse: 大竖要靠左 → 用 page-5-3p2l-left；左右列要同构上竖下横 → 用 page-5-3p2l-stack-left

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更宽则以宽对齐、高度向下留白」（顶齐）。本库仍走相对槽三条。

glyph:
  badge: 3P2L
  thumb: 中大竖 3:4 高 8/9；侧列各 25% 顶底齐；列缝 1.5%；列内缝不动

sourceSketch: sketch.png

# --- 几何（16:9 纸）---
#   与 page-5-3p2l-left 同大竖与侧列宽，但大竖在正中。
#   mainH = 8/9 H；3:4 → mainW = 3/8 W；top = 1/18 H；left = 5/16 W
#   侧列宽 0.25 W
#   16:9 → H = 0.25 H；3:4 宽 0.25 → H = 16/27 H
#   列内缝 = 8/9 − 1/4 − 16/27 = 5/108 H（不动）
#   缝令牌 gapX = 0.015；余宽 0.125 − 0.03 = 0.095 → 左右纸边各 0.0475
#   left port: left 0.0475 W, top 1/18 H
#   left land: left 0.0475 W, top 25/36 H
#   main: left 0.3125 W, top 1/18 H（中竖不动）
#   right land: left 0.7025 W, top 1/18 H
#   right port: left 0.7025 W, top 19/54 H
# 缝令牌试验：只收列缝。列内竖缝要收到令牌必须改侧列宽，本轮不做。
# 不是 page-5-3p2l-left（那边大竖靠左）。
# 现网 screen-mosaic-5-2p3l-portrait-hero-rail 是竖主+辅竖+三横轨，不是同一张。
