#   main: left 0.3125 W, top 1/18 H, 0.375 × 8/9
#   小竖 H = 16/27；宽横 H = 1/4；列内缝 = 5/108（不动）
#   左列 left 0.0475 W；右列 left 0.7025 W
#   上竖 top 1/18 H；下横 top 25/36 H
