# 无独立示意图：由 page-5-3p2l-stack-right 把大竖移到中间，两侧各留一列上竖下横。

id: page-5-3p2l-stack-center
version: 1
status: sketch
kind: primitive
displayName: 中大竖左右上竖下横
sketchName: 3竖2横中
familyId: port-land-stack
canonical: page-5-3p2l-stack-center
related: [page-5-3p2l-stack-left, page-5-3p2l-stack-right]
seeAlso: [page-5-3p2l-center, page-5-1p4l-center]
replaces: screen-mosaic-5-2p3l-portrait-hero-rail
aliases: []
program: mosaic
densityClass: standard
role: port-center-stack-2p2l

stage:
  aspect: "16:9"
  # 中大竖 3:4 高 8/9。左右各一列：上 3:4、下 16:9，各宽 25%。
  # 上下与大竖顶底齐，列内缝 5/108 不动。列缝令牌 1.5%；左右纸边各 4.75%。
  # 槽尺寸与 page-5-3p2l-stack-right 相同，只改列序。
  margin:
    top: 0.055556
    right: 0.0475
    bottom: 0.055556
    left: 0.0475
  gapX: 0.015
  gapY: 0.046296
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 5
mix: { portrait: 3, landscape: 2 }

placement:
  groupAlign: center
  distribute: split-left-stack-center-port-right-stack

slots:
  - { index: 0, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 1, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 2, role: main, orient: portrait, aspect: "3:4" }
  - { index: 3, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 4, role: landscape, orient: landscape, aspect: "16:9" }

copyRegions: []

admit:
  perSlot: true

themes: [portrait, landscape, architecture, sequence]
usage:
  whenToUse: 一张大竖为主居中，左右两列同构（上小竖、下宽横）
  whenNotToUse: 大竖要靠左 → 用 page-5-3p2l-stack-left；靠右 → 用 page-5-3p2l-stack-right；左右要交错 → 用 page-5-3p2l-center

fitPolicy: relative-to-slot

glyph:
  badge: 3P2L
  thumb: 中大竖 3:4 高 8/9；左右皆上 3:4 下 16:9 各 25%

sourceSketch: null

