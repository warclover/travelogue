id: page-3-1s2l-wide-left
version: 1
status: sketch
kind: primitive
displayName: 左方右双宽横
sketchName: 一方两宽横
familyId: square-land-stack-wide
canonical: page-3-1s2l-wide-left
related: [page-3-1s2l-wide-right, page-3-1s2l-left]
seeAlso: [page-3-2l1p-wide-left, page-1-hero-square-right]
replaces: null
aliases: []
program: mosaic
densityClass: standard
role: square-stack-l-wide

stage:
  aspect: "16:9"
  # 方槽 1:1 仍半宽贴左，垂直居中。
  # 两横改 16:9：要保持原叠高 1/3 页高 → 宽亦 1/3。
  # 右半宽剩余 1/6，左右均分各 1/12。上下与槽缝仍三等分（各 1/9）。

slotCount: 3
mix: { portrait: 0, landscape: 2, square: 1 }

placement:
  groupAlign: center
  distribute: split-left-square-right-stack

slots:
  - { index: 0, role: main, orient: square, aspect: "1:1" }
  - { index: 1, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 2, role: landscape, orient: landscape, aspect: "16:9" }

copyRegions: []

admit:
  perSlot: true
  # 方槽：优先 1:1，4:3 / 3:4 可进
  # 横槽：禁竖，优先 16:9

themes: [portrait, landscape, architecture, sequence]
usage:
  whenToUse: 一张方图为主，两张 16:9 宽横辅
  whenNotToUse: 右栏是 4:3 → 用 page-3-1s2l-left；方图更适合靠右 → 用 page-3-1s2l-wide-right

fitPolicy: relative-to-slot

glyph:
  badge: 1S2L
  thumb: 左方 1:1 半宽居中高；右两横 16:9 各 1/3 宽，在右半宽内居中

sourceSketch: null

# --- 几何（16:9 纸）---
#   square: left 0, width 0.50 W, height 0.888889 H, top 0.055556 H
#   landW = landH = 1/3（16:9 槽在 16:9 纸上宽高分数相同）
#   右半宽剩余 1/6 → 列缝 = 右边距 = 1/12 W
#   landLeft = 0.50 + 1/12 = 7/12 W = 0.583333 W
#   剩余高 1/3 三等分 → 顶 / 缝 / 底各 1/9 H
#   land0.top = 1/9 H；land1.top = 5/9 H
# 不是 page-3-1s2l-left（那边横槽 4:3、宽 25%、右栏左右各 12.5%）。
