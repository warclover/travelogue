# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-3-port-hero-left
version: 1
status: sketch
kind: primitive
displayName: 左大右双小
sketchName: 三竖一大二小
familyId: port-hero
canonical: page-3-port-hero-left
related: [page-3-port-hero-right]
seeAlso: [page-3-port, page-2-pair-port, page-1-hero-port]
replaces: null
aliases: []
program: mosaic
densityClass: standard
role: port-hero-l

stage:
  aspect: "16:9"
  # 主图 3:4，上下 5% 页高（与 page-1-hero-port / page-2-1p1l 同高）。
  # 左边距 5%。主辅间距、两辅中缝、右页边皆 5%。
  # 右侧剩余宽扣掉中缝后再均分给两张 3:4。
  margin:
    top: 0.05
    right: 0.05
    bottom: 0.05
    left: 0.05
  gapX: 0.05
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 3
mix: { portrait: 3, landscape: 0 }

placement:
  groupAlign: center
  distribute: split-left-hero-right-pair

slots:
  - { index: 0, role: main, orient: portrait, aspect: "3:4" }
  - { index: 1, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 2, role: portrait, orient: portrait, aspect: "3:4" }

copyRegions: []

admit:
  forbidOrient: [landscape]
  requireOrient: [portrait]
  preferAspect: "3:4"

themes: [portrait, pet, food, sequence]
usage:
  whenToUse: 一张竖图明显更大，两张竖图辅在右侧
  whenNotToUse: 三张等权 → 用 page-3-port；主图更适合靠右 → 用 page-3-port-hero-right；必须消化横图

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁

glyph:
  badge: 3P
  thumb: 左主 3:4 上下 5%；右两辅 3:4 扣 5% 中缝后均分，垂直居中

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 3:4）---
# 主图按高求解（与 page-2-1p1l 竖槽同）：
#   mainH = 0.90 H = 0.50625 W
#   mainW = 0.50625 * (3/4) = 0.3796875 W
#   mainLeft = 0.05 W；mainTop = 0.05 H
# 右侧剩余（左 5% + 主 + 缝 5% + 右 5% 之后）：
#   restW = 1 - 0.05 - 0.3796875 - 0.05 - 0.05 = 0.4703125 W
#   两辅中缝 0.05 W
#   smallW = (0.4703125 - 0.05) / 2 = 0.21015625 W
#   smallH = 0.21015625 * (4/3) W = 0.28020833 W = 0.498148 H
#   smallTop = (1 - 0.498148) / 2 = 0.250926 H
#   small0.left = 0.05 + 0.3796875 + 0.05 = 0.4796875 W
#   small1.left = 0.4796875 + 0.21015625 + 0.05 = 0.73984375 W
# 与 page-3-port（等权三竖）不是同一张。
