# 备用库数据包 · 非正式合同
# 无独立示意图：由 page-5-1p4l-right 把竖槽移到中间，四横拆成左右各一列。

id: page-5-1p4l-center
version: 1
status: sketch
kind: primitive
displayName: 中竖左右各两横
sketchName: 2横1竖2横
familyId: port-4land
canonical: page-5-1p4l-center
related: [page-5-1p4l-left, page-5-1p4l-right]
seeAlso: [page-7-1p6l-center, page-4-grid-land, page-4-1p3l-left]
replaces: screen-mosaic-5-1p4l-portrait-hero
aliases: []
program: mosaic
densityClass: standard
role: port-center-4l

stage:
  aspect: "16:9"
  # 中竖 3:4 高 8/9，独自垂直居中（顶/底各 1/18）。
  # 左右各一列 1×2 横槽 4:3 各宽 25%；上下与竖槽顶底对齐，行缝仍吃剩余高 2/9。
  # 列缝令牌 1.5%；左右纸边各 4.75%。槽尺寸与 page-5-1p4l-right 相同，只改列序。
  margin:
    top: 0.055556
    right: 0.0475
    bottom: 0.055556
    left: 0.0475
  gapX: 0.015
  gapY: 0.222222
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 5
mix: { portrait: 1, landscape: 4 }

placement:
  groupAlign: center
  distribute: split-left-1x2-center-port-right-1x2

slots:
  - { index: 0, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 1, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 2, role: main, orient: portrait, aspect: "3:4" }
  - { index: 3, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 4, role: landscape, orient: landscape, aspect: "4:3" }

copyRegions: []

admit:
  perSlot: true

themes: [portrait, landscape, architecture, sequence]
usage:
  whenToUse: 一张竖图为主居中，四张 4:3 横图左右各一列两张辅
  whenNotToUse: 竖图要靠左 → 用 page-5-1p4l-left；靠右 → 用 page-5-1p4l-right；只要三横一竖 → 用 page-4-1p3l-left；四张等权横 → 用 page-4-grid-land

fitPolicy: relative-to-slot

glyph:
  badge: 2L1P2L
  thumb: 中竖 3:4 高 8/9；左右各 1×2 横 4:3 各 25%，上下与竖槽齐

sourceSketch: null

# --- 几何（16:9 纸）---
#   槽尺寸同 page-5-1p4l-left / -right，只改列序。
#   portH = 8/9 H；3:4 → portW = 3/8 W
#   portLeft = 0.3125 W；portTop = 1/18 H
#   landW = 0.25 W；4:3 → landH = 1/3 H
#   行缝 = 8/9 − 2/3 = 2/9 H（对齐反推，不改）
#   左列 left 0.0475 W；右列 left 0.7025 W
#   land 行 top 1/18 / 11/18 H
# 现网 screen-mosaic-5-1p4l-portrait-hero 是满高竖 + 四条扁轨，不是同一张。
# 不是 page-7-1p6l-center（那边是 16:9 的 1×3）。
