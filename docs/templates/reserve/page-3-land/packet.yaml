# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-3-land
version: 1
status: sketch
kind: primitive
displayName: 三横并排
sketchName: 3张横版一行
familyId: land-row
canonical: page-3-land
related: [page-2-pair-land, page-3-port]
seeAlso: [page-2-pair-land-ultra, page-4-grid-land]
replaces: screen-landscape-3
aliases: []
program: grid
densityClass: standard
role: land-row-3

stage:
  aspect: "16:9"
  # 槽宽仍 30%（4:3 按宽求解）。缝令牌 1.5%；余宽不再四等分。
  # 三槽 + 两缝 = 93%，剩余 7% 全归左右纸边各 3.5%。整组垂直居中；顶底剩余为通栏文案。
  margin:
    left: 0.035
    right: 0.035
  gapX: 0.015
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 3
mix: { portrait: 0, landscape: 3 }

placement:
  groupAlign: center
  distribute: even-x
  emptyCopyKeepsAlign: true

slots:
  - { index: 0, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 1, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 2, role: landscape, orient: landscape, aspect: "4:3" }

copyRegions:
  - id: header
    edge: top
    optional: true
    sizing: leftover          # 三横槽上方剩余，通栏
    collapse: hide-frame
    emptySlotAlign: center
  - id: caption
    edge: bottom
    optional: true
    sizing: leftover          # 三横槽下方剩余，通栏
    collapse: hide-frame
    emptySlotAlign: center

admit:
  forbidOrient: [portrait]
  requireOrient: [landscape]
  preferAspect: "4:3"

themes: [landscape, architecture, sequence]
usage:
  whenToUse: 三张横图一行、无主次
  whenNotToUse: 必须消化竖图；需要上下 stack → 现网 screen-landscape-3；只要两张 → 用 page-2-pair-land

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更宽则以宽对齐、底部留白」（顶齐）。本库仍走相对槽三条。

glyph:
  badge: 3L
  thumb: 三横槽 4:3 各 30%；列缝 1.5%；左右纸边各 3.5%；顶底通栏文案，可空

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 4:3）---
#   slotWidth  = 0.30 W（槽尺寸不变）
#   slotHeight = 0.30 * (3/4) = 0.225 W = 0.40 H
#   slotTop    = (1 - 0.40) / 2 = 0.30 H
#   缝令牌 gapX = 0.015；余宽 0.10 − 0.03 = 0.07 → 左右纸边各 0.035
#   slot0.left = 0.035 W
#   slot1.left = 0.35 W（中槽不动）
#   slot2.left = 0.665 W
# 上文案 / 下文案（通栏，不算槽）：
#   copyLeft   = 0.035 W；copyWidth = 0.93 W
#   header: top 0, height 0.30 H
#   caption: top 0.70 H, height 0.30 H
# 没字：绿框可藏，槽位仍居中。
#
# 附录 A 角色 row-land-3 / 现网 screen-landscape-3 是三横上下 stack，不是同一张。
# 本稿角色用 land-row-3，避免和 stack 待画稿抢名。
# 左右对称，无镜像兄弟。
