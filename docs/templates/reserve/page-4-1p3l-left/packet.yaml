id: page-4-1p3l-left
version: 1
status: sketch
kind: primitive
displayName: 左竖右三横
sketchName: 三横一竖
familyId: port-3land
canonical: page-4-1p3l-left
related: [page-4-1p3l-right]
seeAlso: [page-3-2l1p-left, page-4-grid-land, page-3-land]
replaces: null
aliases: []
program: mosaic
densityClass: standard
role: port-stack-3l

stage:
  aspect: "16:9"
  # 竖槽 3:4，高 8/9 页高。右栏宽 7/16：上两横各 3/16、缝 1/16，下横 7/16。
  # 竖槽宽由 3:4 反推为 6/16。剩余宽 3/16 三等分 → 左 / 列缝 / 右各 1/16。
  # 两列等高：右栏槽缝 = 8/9 − 1/4 − 7/12 = 1/18 页高。
  margin:
    top: 0.055556
    right: 0.0625
    bottom: 0.055556
    left: 0.0625
  gapX: 0.0625
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 4
mix: { portrait: 1, landscape: 3 }

placement:
  groupAlign: center
  distribute: split-left-port-right-2l1l

slots:
  - { index: 0, role: main, orient: portrait, aspect: "3:4" }
  - { index: 1, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 2, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 3, role: landscape, orient: landscape, aspect: "4:3" }

copyRegions: []

admit:
  perSlot: true
  # 竖槽：禁横，优先 3:4
  # 横槽：禁竖，优先 4:3

themes: [portrait, landscape, architecture, sequence]
usage:
  whenToUse: 一张竖图为主，三张横图辅（右上两张小、右下一张宽）
  whenNotToUse: 四张都是横 → 用 page-4-grid-land；竖图更适合靠右 → 用 page-4-1p3l-right；只要两横一竖

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁

glyph:
  badge: 1P3L
  thumb: 左竖 3:4 高 8/9；右上两横各 3/16、右下横 7/16

sourceSketch: sketch.png

# --- 几何（16:9 纸）---
#   portH = 8/9 H；3:4 → portW = (8/9)*(3/4)*(9/16) W = 6/16 W
#   portLeft = 1/16 W；portTop = 1/18 H
#   colLeft = 1/16 + 6/16 + 1/16 = 8/16 W
#   landS.W = 3/16 W；4:3 → landS.H = 1/4 H
#   landL.W = 7/16 W；4:3 → landL.H = 7/12 H
#   上两横缝 = 7/16 − 3/16 − 3/16 = 1/16 W
#   右栏上下缝 = 8/9 − 1/4 − 7/12 = 1/18 H
#   land0: left 8/16 W, top 1/18 H
#   land1: left 8/16+3/16+1/16 = 12/16 W, top 1/18 H
#   land2: left 8/16 W, top 1/18+1/4+1/18 = 13/36 H
