# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-6-1l5l-wide-left
version: 1
status: sketch
kind: primitive
displayName: 左主宽横右下五小
sketchName: 宽幅1大横4小横
familyId: land-hero-5-wide
canonical: page-6-1l5l-wide-left
related: [page-6-1l5l-wide-right]
seeAlso: [page-4-1l3l-wide-left, page-1-hero-land-wide]
replaces: null
aliases: [page-5-1l4l-wide-left]
program: mosaic
densityClass: standard
role: land-hero-5l-wide

stage:
  aspect: "16:9"
  # 侧栏三小 16:9 各 30%，垂直居中均分：剩余高 10% 四等分 → 顶/缝/缝/底各 2.5%。
  # 底行三小 16:9 各 30%，横向占满：剩余宽 10% 作两道内缝各 5%（左 0 / 35% / 70%）。
  # 大横 16:9 吃满侧栏顶到的剩余高 65%（顶 2.5% → 底行 67.5%），宽同 65%；
  # 左齐；右侧距侧栏 5%，不与任何缝对齐。
  # 右下角一槽既是侧栏第三、也是底行第三。
  margin:
    top: 0.025
    right: 0
    bottom: 0.025
    left: 0
  gapX: 0.05
  gapY: 0.025
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 6
# 示意图用途写成 1 大 4 小。按更正为 1 大 5 小。
mix: { portrait: 0, landscape: 6 }

placement:
  groupAlign: top-left
  distribute: split-left-land-right-3l-bottom-3l

slots:
  - { index: 0, role: main, orient: landscape, aspect: "16:9" }
  - { index: 1, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 2, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 3, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 4, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 5, role: landscape, orient: landscape, aspect: "16:9" }

copyRegions: []

admit:
  forbidOrient: [portrait]
  requireOrient: [landscape]
  preferAspect: "16:9"

themes: [landscape, architecture, sequence]
usage:
  whenToUse: 一张 16:9 大横顶齐左齐，侧栏三小垂直均分，底行三小占满宽
  whenNotToUse: 只要三张小横 → 用 page-4-1l3l-wide-left；六张等权 → 用 page-6-grid-land；主图更适合靠右 → 用 page-6-1l5l-wide-right

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更宽则以宽对齐、高度向下留白」（顶齐）。本库仍走相对槽三条。

glyph:
  badge: 1L5L
  thumb: 大横 65% 顶齐左齐贴底行；右侧三小垂直均分；底三小占满宽

sourceSketch: sketch.png

# --- 几何（16:9 纸，槽亦 16:9 → 宽高分数相同）---
#   小槽 0.30 × 0.30；大槽 0.65 × 0.65（剩余高用尽）
#   侧栏（右）top: 0.025 / 0.35 / 0.675；left 0.70
#   底行 left: 0 / 0.35 / 0.70；top 0.675
#   main: left 0, top 0.025
#   大槽底缘 0.675 贴底行；右缘 0.65 → 距侧栏 0.05，不对齐
# 不是 page-4-1l3l-wide-left（那边是 1 大 + 3 小侧栏）。
