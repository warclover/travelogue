# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-8-grid-port
version: 1
status: sketch
kind: primitive
displayName: 竖版八宫格
sketchName: 8竖
familyId: portrait-grid
canonical: page-8-grid-port
related: [page-10-grid-port, page-4-port]
seeAlso: [page-8-grid-land, page-5-1p4p-left]
replaces: null
aliases: []
program: grid
densityClass: dense
role: grid-8-port

stage:
  aspect: "16:9"
  # 单槽 3:4，宽 18.75%（与 page-5-1p4p-left 小竖 / page-10-grid-port 同尺寸）。
  # 4 列 × 2 行。列缝 / 行缝令牌各 1.5%。余宽左右均分；余高上下均分（整组居中）。
  margin:
    top: 0.048056
    right: 0.1025
    bottom: 0.048056
    left: 0.1025
  gapX: 0.015
  gapY: 0.015
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 8
mix: { portrait: 8, landscape: 0 }

placement:
  groupAlign: center
  distribute: even-grid
  columns: 4
  rows: 2

slots:
  - { index: 0, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 1, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 2, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 3, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 4, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 5, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 6, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 7, role: portrait, orient: portrait, aspect: "3:4" }

copyRegions: []

admit:
  forbidOrient: [landscape]
  requireOrient: [portrait]
  preferAspect: "3:4"

themes: [portrait, pet, food, sequence]
usage:
  whenToUse: 八张 3:4 竖图 4×2 等权并置；连拍 / 序列
  whenNotToUse: 只要四竖 → 用 page-4-port；只要十竖 → 用 page-10-grid-port；八张都是横 → 用 page-8-grid-land；必须消化横图

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更宽则以宽对齐、高度向下留白」（顶齐）。本库仍走相对槽三条。

glyph:
  badge: 8P
  thumb: 4×2 竖槽 3:4 各宽 18.75%；列缝/行缝令牌 1.5%；整组居中

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 3:4）---
#   slotW = 0.1875 W；slotH = 4/9 H
#   四列 + 三道列缝 1.5% = 0.795 W → 左右纸边各 0.1025 W
#   两行 + 一道行缝 1.5% = 0.903889 H → 顶/底各 0.048056 H
#   列 left: 0.1025 / 0.305 / 0.5075 / 0.71
#   行 top:  0.048056 / 0.5075
# 左右对称，无镜像兄弟。
# 不是 page-10-grid-port（那边是 5×2，余宽六等分、行缝仍 1/27）。
# 不是 page-8-grid-land（那边是 4×2 横槽）。
# 现网 screen-portrait-grid-8 是 9:16 八竖，不是同一张。
