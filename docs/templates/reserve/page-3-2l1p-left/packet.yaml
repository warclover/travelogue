id: page-3-2l1p-left
version: 1
status: sketch
kind: primitive
displayName: 左竖右双横
sketchName: 1竖2横
familyId: land-stack-port
canonical: page-3-2l1p-left
related: [page-3-2l1p-right]
seeAlso: [page-2-1p1l, page-3-port]
replaces: screen-portrait-1-landscape-2
aliases: [page-3-organic-lport]
program: mosaic
densityClass: standard
role: port-stack-l

stage:
  aspect: "16:9"
  # 示意图：竖槽满高 3:4；两横合计满高、各 4:3；列间细缝；整组水平居中。
  # 上下不留页边（满高）。列间距 2% 页宽，横槽间距 2.5% 页高。
  margin:
    top: 0
    bottom: 0
  gapX: 0.02
  gapY: 0.025
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 3
mix: { portrait: 1, landscape: 2 }

placement:
  groupAlign: center
  distribute: split-left-port-right-stack

slots:
  - { index: 0, role: main, orient: portrait, aspect: "3:4" }
  - { index: 1, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 2, role: landscape, orient: landscape, aspect: "4:3" }

copyRegions: []

admit:
  perSlot: true
  # 竖槽禁横，横槽禁竖

themes: [landscape, portrait, architecture, sequence]
usage:
  whenToUse: 左竖为主图，右两张横图辅（过程 / 对仗）
  whenNotToUse: 三张同朝向；需要等权三竖；竖图更适合靠右 → 用 page-3-2l1p-right

fitPolicy: relative-to-slot

glyph:
  badge: 1P2L
  thumb: 左一竖 3:4 满高，右两横 4:3 叠满高

sourceSketch: sketch.png

# --- 几何（16:9 纸）---
#   colH  = pageH = 0.5625 W
#   portW = 0.5625 * 3/4 = 0.421875 W
#   landH = (0.5625 - 0.025 * 0.5625) / 2 = 0.27421875 W
#   landW = 0.27421875 * 4/3 = 0.365625 W
#   groupW = 0.421875 + 0.02 + 0.365625 = 0.8075 W
#   side   = (1 - 0.8075) / 2 = 0.09625 W
#   port: left 0.09625 W, top 0, 42.1875% × 100%
#   land: left 0.538125 W, 36.5625% × 48.75%；上顶 0、下顶 51.25%
#
# 相对附录 A：那边距 7/6 + 未满高。本稿满高、由槽比反推左右留白。
