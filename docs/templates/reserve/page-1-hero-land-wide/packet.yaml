# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-1-hero-land-wide
version: 1
status: sketch
kind: primitive
displayName: 单图 · 横版英雄 · 16:9
sketchName: 单张横版 16:9
familyId: hero-land
canonical: page-1-hero-land-wide
related: [page-1-hero-land, page-1-hero-land-right, page-1-hero-land-ultra]
replaces: screen-landscape-1
aliases: []
program: hero
densityClass: airy
role: hero-land

stage:
  aspect: "16:9"
  # 「四周留白 6.25%」：左右相对页宽，上下相对页高。等比例边距才能让槽仍是 16:9。
  margin:
    top: 0.0625
    right: 0.0625
    bottom: 0.0625
    left: 0.0625
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 1
mix: { portrait: 0, landscape: 1 }

placement:
  groupAlign: center
  distribute: none

slots:
  - { index: 0, role: main, orient: landscape, aspect: "16:9" }

copyRegions: []

admit:
  forbidOrient: [portrait]
  requireOrient: [landscape]
  preferAspect: "16:9"

themes: [landscape, architecture, portrait]
usage:
  whenToUse: 高光池单张横图；原图已是 16:9 或接近宽幅时
  whenNotToUse: 必须消化竖图；需要多图并置；需要 4:3 槽 → 用 page-1-hero-land / page-1-hero-land-right

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁

glyph:
  badge: 1L
  thumb: 一横槽 16:9 居中，四周 6.25% 留白，无文案栏

sourceSketch: sketch.png

# --- 几何（16:9 纸，槽比必须等于 16:9）---
# contentWidth  = pageWidth  * (1 - 0.0625 * 2) = 0.875 W
# contentHeight = pageHeight * (1 - 0.0625 * 2) = 0.875 H
# 槽铺满 content（槽比 = 纸比）：
#   slotLeft   = 0.0625 W
#   slotTop    = 0.0625 H
#   slotWidth  = 0.875 W
#   slotHeight = 0.875 H
# 校验：slotWidth / slotHeight = 0.875W / (0.875 * 9/16 W) = 16/9
