# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-3-port
version: 1
status: sketch
kind: primitive
displayName: 三竖并排
sketchName: 三竖并排
familyId: portrait-row
canonical: page-3-port
related: [page-2-pair-port]
seeAlso: [page-1-hero-port]
replaces: screen-portrait-3
aliases: [page-3-organic-port]
program: grid
densityClass: standard
role: row-port-3

stage:
  aspect: "16:9"
  # 槽宽仍 30%（3:4 按宽求解）。余下 10% 四等分：左右与两缝各 2.5%。
  # 上下不写死边距：整组垂直居中。
  margin:
    left: 0.025
    right: 0.025
  gapX: 0.025
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 3
mix: { portrait: 3, landscape: 0 }

placement:
  groupAlign: center
  distribute: even-x

slots:
  - { index: 0, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 1, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 2, role: portrait, orient: portrait, aspect: "3:4" }

copyRegions: []

admit:
  forbidOrient: [landscape]
  requireOrient: [portrait]
  preferAspect: "3:4"

themes: [portrait, pet, food, landscape]
usage:
  whenToUse: 三张竖图并排、无主次；人像 / 竖构图风景 / 宠物 / 美食
  whenNotToUse: 必须消化横图；需要一张明显更大的英雄

fitPolicy: relative-to-slot

glyph:
  badge: 3P
  thumb: 三竖槽 3:4 各 30%，左右与缝各 2.5%，整组垂直居中

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 3:4）---
#   slotWidth  = 0.30 W（槽尺寸不变）
#   slotHeight = 0.30 / 0.75 = 0.40 W = 0.711111 H
#   slotTop    = (1 - 0.711111) / 2 H = 0.144444 H
#   余宽 0.10 / 4 = 0.025 → 左 / 缝 / 缝 / 右
#   slot0.left = 0.025 W
#   slot1.left = 0.35 W
#   slot2.left = 0.675 W
#
# 相对附录 A 已设计稿：那边距 8/6/8/6 + gapX 2% + 顶底可空文案。
# 本备用稿槽仍 30%、余宽均分出缝、无文案、垂直居中。升格时以哪一版为准需你拍板。
