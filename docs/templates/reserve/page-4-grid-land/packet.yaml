# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-4-grid-land
version: 1
status: sketch
kind: primitive
displayName: 横版四宫
sketchName: 横4宫格
familyId: land-grid
canonical: page-4-grid-land
related: [page-2-pair-land, page-3-land]
seeAlso: [page-2-pair-square]
replaces: screen-landscape-4
aliases: [page-4-grid-equal]
program: grid
densityClass: standard
role: grid-4-land

stage:
  aspect: "16:9"
  # 示意图：单槽高 44.4% 页高（按 4/9）。4:3 → 单槽宽 = 1/3 页宽。
  # 剩余高 1/9、剩余宽 1/3，各自三等分（顶/缝/底，左/缝/右）。
  margin:
    top: 0.037037
    right: 0.111111
    bottom: 0.037037
    left: 0.111111
  gapX: 0.111111
  gapY: 0.037037
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 4
# 示意图用途写成「三张横版」。图上是 2×2 四槽，按图。
mix: { portrait: 0, landscape: 4 }

placement:
  groupAlign: center
  distribute: even-grid
  columns: 2
  rows: 2

slots:
  - { index: 0, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 1, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 2, role: landscape, orient: landscape, aspect: "4:3" }
  - { index: 3, role: landscape, orient: landscape, aspect: "4:3" }

copyRegions: []

admit:
  forbidOrient: [portrait]
  requireOrient: [landscape]
  preferAspect: "4:3"

themes: [landscape, portrait, architecture, sequence]
usage:
  whenToUse: 四张横图 2×2 等权并置
  whenNotToUse: 必须消化竖图；需要一张明显英雄；只要三张一行 → 用 page-3-land

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更宽则以宽对齐、底部留白」（顶齐）。本库仍走相对槽三条。

glyph:
  badge: 4L
  thumb: 2×2 横槽 4:3；单槽高 4/9，剩余宽高各自三等分

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 4:3）---
#   slotH = 4/9 H = 0.444444 H
#   slotW = (4/9 H) * (4/3) / (9/16 W) * W = 1/3 W
#   剩余高 1/9 → 顶 / 缝 / 底各 1/27 H = 0.037037 H
#   剩余宽 1/3 → 左 / 缝 / 右各 1/9 W = 0.111111 W
#   slot00: left 0.111111 W, top 0.037037 H
#   slot01: left 0.555556 W, top 0.037037 H
#   slot10: left 0.111111 W, top 0.518519 H
#   slot11: left 0.555556 W, top 0.518519 H
#
# 用途栏写「三张」，按图是四槽。
# 相对附录 A 已设计稿：那边距 7/7 + gapX 2% + gapY 3%。
# 本稿槽高锁 4/9、剩余三等分。升格时以哪一版为准需你拍板。
# 左右对称，无镜像兄弟。
# 现网 screen-landscape-4 偏满幅，不是同一张。
