# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-4-port
version: 1
status: sketch
kind: primitive
displayName: 四竖并排
sketchName: 四竖1排
familyId: portrait-row
canonical: page-4-port
related: [page-3-port, page-2-pair-port]
seeAlso: [page-1-hero-port, page-3-2p1s]
replaces: screen-portrait-4
aliases: []
program: grid
densityClass: standard
role: row-port-4

stage:
  aspect: "16:9"
  # 顶 5% 页高。四槽贴边会超宽，槽宽收到 21.875%。
  # 余宽 12.5% 五等分：左右与三缝各 2.5%。
  # 槽按 3:4 定高后，底部剩余通栏文案，可空。
  margin:
    top: 0.05
    left: 0.025
    right: 0.025
  gapX: 0.025
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 4
mix: { portrait: 4, landscape: 0 }

placement:
  groupAlign: top
  distribute: even-x

slots:
  - { index: 0, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 1, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 2, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 3, role: portrait, orient: portrait, aspect: "3:4" }

copyRegions:
  - id: caption
    edge: bottom
    optional: true
    sizing: leftover
    collapse: hide-frame
    emptySlotAlign: top

admit:
  forbidOrient: [landscape]
  requireOrient: [portrait]
  preferAspect: "3:4"

themes: [portrait, pet, food, landscape]
usage:
  whenToUse: 四张竖图一行并排、无主次；人像 / 竖构图风景 / 宠物 / 美食
  whenNotToUse: 必须消化横图；只要三竖 → 用 page-3-port；需要 2×2 宫格

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更高则以宽对齐、左右留白」。本库仍走相对槽三条。

glyph:
  badge: 4P
  thumb: 四竖槽 3:4 各 21.875% 顶齐，左右与缝各 2.5%；下为通栏剩余文案，可空

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 3:4）---
#   slotW = 0.21875 W（7/32）
#   slotH = 0.21875 * (16/9) * (4/3) H = 14/27 H = 0.518519 H
#   slotTop = 0.05 H
#   余宽 0.125 / 5 = 0.025 → 左 / 缝 / 缝 / 缝 / 右
#   slot0..3.left = 0.025 / 0.26875 / 0.5125 / 0.75625 W
#   copy: left 0.025、宽 0.95；top 0.05 + 14/27 = 0.568519 H，高 0.431481 H
# 左右对称，无镜像兄弟。
# 现网 screen-portrait-4 是 9:16 舞台 2×2，不是同一张。
# 角色对照待画的 grid-4-port 也是 2×2，不是这一行。
