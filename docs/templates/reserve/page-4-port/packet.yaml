# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-4-port
version: 2
status: sketch
kind: primitive
displayName: 四竖并排
sketchName: 四竖1排
familyId: portrait-row
canonical: page-4-port
related: [page-3-port, page-2-pair-port]
seeAlso: [page-1-hero-port, page-3-2p1s]
replaces: screen-portrait-4
aliases: []
program: grid
densityClass: standard
role: row-port-4

stage:
  aspect: "16:9"
  # 四槽贴边会超宽，槽宽仍 21.875%。
  # 缝令牌 1.5%；余宽不再五等分。四槽 + 三缝 = 92%，剩余 8% 归左右纸边各 4%。
  # 槽高不变，整组上下居中。
  margin:
    top: 0.05
    left: 0.04
    right: 0.04
  gapX: 0.015
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 4
mix: { portrait: 4, landscape: 0 }

placement:
  groupAlign: center
  distribute: even-x

slots:
  - { index: 0, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 1, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 2, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 3, role: portrait, orient: portrait, aspect: "3:4" }

copyRegions: []

admit:
  forbidOrient: [landscape]
  requireOrient: [portrait]
  preferAspect: "3:4"

themes: [portrait, pet, food, landscape]
usage:
  whenToUse: 四张竖图一行并排、无主次；人像 / 竖构图风景 / 宠物 / 美食；不要文案栏时
  whenNotToUse: 必须消化横图；只要三竖 → 用 page-3-port；需要 2×2 宫格

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写「更高则以宽对齐、左右留白」。本库仍走相对槽三条。

glyph:
  badge: 4P
  thumb: 四竖槽 3:4 各 21.875% 上下居中；列缝 1.5%；左右纸边各 4%；无文案栏

sourceSketch: sketch.png

# --- 几何（16:9 纸，每槽必须等于 3:4）---
# 槽尺寸与左右位置沿用 v1：
#   slotW = 0.21875 W（7/32）
#   slotH = 0.21875 * (16/9) * (4/3) H = 14/27 H = 0.518519 H
#   缝令牌 gapX = 0.015；余宽 0.125 − 0.045 = 0.08 → 左右纸边各 0.04
#   slot0..3.left = 0.04 / 0.27375 / 0.5075 / 0.74125 W
# v2 上下居中，取消文案栏：
#   slotTop = (1 - 14/27) / 2 = 13/54 H = 0.240741 H
# 上下剩余各 0.240741 H，不是文案栏。
# 左右对称，无镜像兄弟。
# 现网 screen-portrait-4 是 9:16 舞台 2×2，不是同一张。
# 角色对照待画的 grid-4-port 也是 2×2，不是这一行。
