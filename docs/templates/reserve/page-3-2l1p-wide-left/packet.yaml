# 备用库数据包 · 非正式合同
# 无独立示意图：由 page-3-2l1p-left 改右栏 16:9，左右与列缝三等分。

id: page-3-2l1p-wide-left
version: 1
status: sketch
kind: primitive
displayName: 左竖右双宽横
sketchName: 1竖2宽横
familyId: land-stack-port-wide
canonical: page-3-2l1p-wide-left
related: [page-3-2l1p-wide-right, page-3-2l1p-left]
seeAlso: [page-2-1l1p-wide, page-3-2l1p-right]
replaces: screen-portrait-1-landscape-2
aliases: []
program: mosaic
densityClass: standard
role: port-stack-l-wide

stage:
  aspect: "16:9"
  # 竖槽 3:4 满高；两横 16:9 叠满高，横缝仍 2.5% 页高。
  # 剩余宽三等分 → 左 / 列缝 / 右。
  margin:
    top: 0
    right: 0.030208
    bottom: 0
    left: 0.030208
  gapX: 0.030208
  gapY: 0.025
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 3
mix: { portrait: 1, landscape: 2 }

placement:
  groupAlign: center
  distribute: split-left-port-right-stack

slots:
  - { index: 0, role: main, orient: portrait, aspect: "3:4" }
  - { index: 1, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 2, role: landscape, orient: landscape, aspect: "16:9" }

copyRegions: []

admit:
  perSlot: true
  # 竖槽禁横，横槽禁竖；横槽优先 16:9

themes: [landscape, portrait, architecture, sequence]
usage:
  whenToUse: 左竖为主图，右两张 16:9 宽横辅
  whenNotToUse: 右栏是 4:3 → 用 page-3-2l1p-left；竖图更适合靠右 → 用 page-3-2l1p-wide-right

fitPolicy: relative-to-slot

glyph:
  badge: 1P2L
  thumb: 左一竖 3:4 满高，右两横 16:9 叠满高；左右与列缝三等分

sourceSketch: null

# --- 几何（16:9 纸）---
#   portH = H；3:4 → portW = (9/16)*(3/4) W = 27/64 W = 0.421875 W
#   landH = (1 − 0.025) / 2 H = 0.4875 H
#   16:9 槽在 16:9 纸上 → landW = 0.4875 W
#   剩余宽 1 − 0.421875 − 0.4875 = 0.090625 → 三等分 0.030208 W
#   port: left 0.030208 W, top 0, 42.1875% × 100%
#   land: left 0.482292 W, 48.75% × 48.75%；上顶 0、下顶 51.25%
# 不是 page-3-2l1p-left（那边右栏 4:3，左右约 9.6%）。
# 无独立示意图。左右对称的镜像是 page-3-2l1p-wide-right。
