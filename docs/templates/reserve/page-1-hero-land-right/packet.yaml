# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-1-hero-land-right
version: 2
status: sketch
kind: primitive
displayName: 单图 · 横版英雄 · 居中
sketchName: 单张横版
familyId: hero-land
canonical: page-1-hero-land-right
related: [page-1-hero-land, page-1-hero-land-wide, page-1-hero-land-ultra]
replaces: screen-landscape-1
aliases: []
program: hero
densityClass: airy
role: hero-land

stage:
  aspect: "16:9"
  # 「上下留白 5%」：左右相对页宽，上下相对页高。槽宽不变，水平居中。
  margin:
    top: 0.05
    right: 0.05
    bottom: 0.05
    left: 0.05
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 1
mix: { portrait: 0, landscape: 1 }

placement:
  groupAlign: center
  distribute: none

slots:
  - { index: 0, role: main, orient: landscape, aspect: "4:3" }

copyRegions: []

admit:
  forbidOrient: [portrait]
  requireOrient: [landscape]
  preferAspect: "4:3"

themes: [landscape, architecture, portrait]
usage:
  whenToUse: 高光池单张横图；4:3 槽居中、不要文案栏时
  whenNotToUse: 必须消化竖图；需要多图并置；需要 16:9 / 21:9 槽 → 用 -wide / -ultra

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁

glyph:
  badge: 1L
  thumb: 一横槽 4:3 左右居中，上下 5% 留白；无文案栏

sourceSketch: sketch.png

# --- 几何（16:9 纸，槽比必须等于 4:3）---
# 槽尺寸沿用 v1（按高求解）：
#   slotHeight = contentHeight                                      = 0.90 H
#   slotWidth  = slotHeight * (4/3)                                 = 0.675 W
# v2 左右居中，取消文案栏：
#   slotLeft   = (1 - slotWidth) / 2                                = 0.1625 W
#   slotTop    = margin.top * H                                     = 0.05 H
# 左右剩余各 0.1625 W，不是文案栏。
