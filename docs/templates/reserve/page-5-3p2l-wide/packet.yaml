# 备用库数据包 · 非正式合同
# 升附录 A 前只给人审几何与用途；引擎不读。

id: page-5-3p2l-wide
version: 1
status: sketch
kind: primitive
displayName: 上三竖下两宽横
sketchName: 3竖2横宽幅
familyId: mix-3p2l-wide
canonical: page-5-3p2l-wide
related: []
seeAlso: [page-3-port, page-2-pair-land, page-5-3p2l-stack-center, page-4-grid-land-wide]
replaces: null
aliases: []
program: mosaic
densityClass: standard
role: row-3p-pair-l-wide

stage:
  aspect: "16:9"
  # 上三竖 3:4 各宽 22%。下两宽横 16:9 各宽 37.5%，中缝令牌 1.5%，整行居中。
  # 上三竖左右外沿与下两横外沿对齐，中间两缝均分剩余。行缝令牌 1.5%；余高上下均分。
  margin:
    top: 0.044259
    right: 0.1175
    bottom: 0.044259
    left: 0.1175
  gapX: 0.015
  gapY: 0.015
  marginBasis:
    x: pageWidth
    y: pageHeight

slotCount: 5
mix: { portrait: 3, landscape: 2 }

placement:
  groupAlign: center
  distribute: row-3p-over-pair-l

slots:
  - { index: 0, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 1, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 2, role: portrait, orient: portrait, aspect: "3:4" }
  - { index: 3, role: landscape, orient: landscape, aspect: "16:9" }
  - { index: 4, role: landscape, orient: landscape, aspect: "16:9" }

copyRegions: []

admit:
  perSlot: true
  # 竖槽：禁横，优先 3:4
  # 横槽：禁竖，优先 16:9

themes: [portrait, landscape, sequence, food]
usage:
  whenToUse: 三张竖图一排在上，两张 16:9 宽横居中在下
  whenNotToUse: 大竖为主的交错 / 同构三列 → 用 page-5-3p2l-*；只要三竖 → 用 page-3-port；只要两横 → 用 page-2-pair-land

fitPolicy: relative-to-slot
# 同比例铺满
# 比槽更宽 → 以宽对齐，上下留白
# 比槽更高 → 以高对齐，左右留白
# 朝向不符 → 禁入，不硬裁
# 示意图兜底写 4:3 进 16:9 槽要裁。本库仍走相对槽三条；朝向不符禁入。

glyph:
  badge: 3P2L
  thumb: 上三竖 3:4 各 22%，外沿与下两横齐；下两宽横 16:9 各 37.5%，中缝 1.5%

sourceSketch: sketch.png

# --- 几何（16:9 纸）---
#   portW = 0.22 W；3:4 → portH = 0.22 × (16/9) × (4/3) H = 0.521481 H
#   landW = 0.375 W；16:9 → landH = 0.375 H
#   下两横 + 中缝 1.5% = 0.765 W → 左右纸边各 0.1175 W
#   上三竖外沿与下两横齐：port0.left = 0.1175；port2.left = 0.6625
#   中间均分：两缝各 0.0525 W；中竖 left = 0.39 W
#   行缝 1.5%；余高 0.088519 → 顶/底各 0.044259 H
# 左右对称，无镜像兄弟。
# 不是 page-5-3p2l-stack-* / page-5-3p2l-center（那边是大竖 + 侧列）。
# 不是 page-3-port（那边是单行三竖 30%）。
