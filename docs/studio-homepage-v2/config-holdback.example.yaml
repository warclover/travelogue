# Studio 首页 v2 · holdback 灰度配置片段（M20-i/j）
#
# 合并到项目根 config.yaml，或通过 Studio 启动参数传入：
#   travelogue serve --studio ./trips --config config.yaml
#
# 门控模式由环境变量 TRAVELOGUE_STUDIO_HOMEPAGE_V2 控制：
#   off  → GET / 始终 v3；GET /v2 直达 v2（本地 dev 默认）
#   auto → 按下方 percent + 稳定分桶决定 GET / 是否 302 → /v2
#   on   → GET / 100% serve v2（M20-j 切主站；v3 迁 /classic）
#
# percent 优先级：TRAVELOGUE_STUDIO_HOMEPAGE_V2_PERCENT（env）> 本 yaml > 0
#
# 分桶：Cookie travelogue.studio.hp_bucket（0–99），无则 SHA256(盐:UA) % 100
# 进组条件：bucket < percent（percent=10 → bucket 0–9 进 v2）
#
# 运维自检：
#   TRAVELOGUE_STUDIO_HOMEPAGE_V2=auto python scripts/studio_homepage_gate_status.py --ua "M20jTest/5"
#   TRAVELOGUE_STUDIO_HOMEPAGE_V2=auto TRAVELOGUE_STUDIO_HOMEPAGE_V2_PERCENT=10 \\
#       python scripts/studio_homepage_gate_status.py --ua "M20jTest/5" --json

studio:
  homepage:
    v2_bento:
      # 0–100 · holdback 进 v2 组比例；dogfood 建议 10，全量切主站改 TRAVELOGUE_STUDIO_HOMEPAGE_V2=on
      percent: 10
