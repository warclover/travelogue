# Cluster-Boundary-First V1 · dogfood snippet (PLAN 已审定稿)
# Merge into local config.yaml under existing ``shotGrouping`` (camelCase preferred by this repo).
# W1: keep tri-col equal experimental SKUs OFF while validating boundaries.

shotGrouping:
  enabled: true
  mosaic:
    sliceCrossGroupHardReject: true
    sameGroupAntiSlice: true
    atom:
      enabled: true
      maxGapSeconds: 600
      maxWindowSpanSeconds: 7200
      sceneClusterMode: compatible   # 半硬；勿用 force_same
      categoryJumpIsHard: false
      allowTailCrossAtom: false

