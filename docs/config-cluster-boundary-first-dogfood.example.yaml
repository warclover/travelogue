# Cluster-Boundary-First V1 · dogfood snippet (PLAN 已审定稿)
# Merge into local config.yaml for demo-49cbe46479 (or set atom.enabled globally).
# W1: keep tri-col equal experimental SKUs OFF while validating boundaries.

shot_grouping:
  enabled: true
  mosaic:
    slice_cross_group_hard_reject: true
    same_group_anti_slice: true
    atom:
      enabled: true
      max_gap_seconds: 600
      max_window_span_seconds: 7200
      scene_cluster_mode: compatible   # 半硬；勿用 force_same
      category_jump_is_hard: false
      allow_tail_cross_atom: false

