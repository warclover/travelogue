# Cluster-Boundary-First V1 · dogfood snippet (PLAN 已审定稿)
# Merge into local config.yaml under existing ``shotGrouping`` (camelCase preferred by this repo).
# W1: keep tri-col equal experimental SKUs OFF while validating boundaries.

shotGrouping:
  enabled: true
  mosaic:
    sliceCrossGroupHardReject: true
    sameGroupAntiSlice: true
    atom:
      enabled: true
      maxGapSeconds: 600
      maxWindowSpanSeconds: 7200
      sceneClusterMode: compatible   # 半硬；勿用 force_same
      categoryJumpIsHard: false      # W1 软惩罚在 scorer；勿升硬除非碎度可接受
      allowTailCrossAtom: false      # attach 尾部合并不跨 atom
      missingShotGroupMode: time_bridge  # 双侧无 shotGroup → 靠时间+半硬 sc（弱 SSG 册）
      strongTemplateMaxSpanSeconds: null   # 禁止 300 hard
      strongTemplateSpanSoftSeconds: 900
      mosaicShareFloorObserve: 0.70  # 多槽占比观察护栏（不自动放宽边界）

