# Pipeline Throughput · 推荐 config 快照（G0 benchmark / 验收）

# 用法：复制为临时 config 或与现有 config merge。
# Baseline 登记时：将 parallel_ingest 保持 false，narrate_concurrency 保持 1。
# Candidate：打开下方 PT 开关后同机对比。

vision:
  enabled: auto
  batch_size: 16
  session_singleton: true
  # NR-PT L-embed 对比时改为 false（或走源图路径）
  prefer_web_derivative: true
  web_derivative_cosine_max: 0.02
  preload_on_folder_pick: true

ingest:
  # PRD-PIPELINE-PERF-V1 · R1.3 / R1.4（E-B，可单独回退）
  webp_method: 2
  # R2.3 · 金字塔缩放默认关（SSIM 报告后再开）
  webp_pyramid: false
  shared_color_thumb_px: 32
  face_detect_max_edge: 1024
  webp_widths: [800, 1600, 2400, 3200]
  webp_ingest_widths: [800, 1600]

aesthetic:
  # R4.1 · ingest 期间重叠预热 NIMA（只重叠不换源；需 pyiqa）
  warm_learned_on_ingest: true

pipeline:
  parallel_embed: true
  parallel_embed_chunk: 32
  # --- Pipeline Throughput + PIPELINE-PERF-V1 ---
  parallel_ingest: true
  # 0 = auto max(2, min(cpu//2, 10)) + long-edge memory cap
  parallel_ingest_workers: 0
  parallel_ingest_min_photos: 12
  persist_every_n: 8
  deferred_derivatives: true

layout_scoring:
  skip_duplicate_signatures: true
  incremental: false

clustering:
  deterministic: true
  force_recluster: false

llm:
  narrate_concurrency: 1
  narrate_concurrency_backoff: true
