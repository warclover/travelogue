# MSA dogfood — enable slot adaptation on a local config overlay.
# Default remains fail-closed (enabled: false) until M3.
#
# Usage: merge under mosaic: in your local config.yaml (do not commit secrets).

mosaic:
  slot_adaptation:
    enabled: true
    whitespace_max: 0.08
    crop_risk_contain_threshold: 0.55
    hero_target_clamp: [1.30, 1.60]
    wide_peak_fraction: 0.50
    land_peaks:
      three_two: 1.50
      four_three: 1.3333
      sixteen_nine: 1.7778
    solve:
      max_iters: 32
      track_weight_min: 0.5
      track_weight_max: 24.0
