# TPC / poster_bric · 本机狗粮示例（勿把 enabled=true 合进仓库默认）
#
# 用法：
#   1. 复制下列片段到项目根 config.yaml（已 gitignore）
#   2. 或：Copy-Item docs/config-tpc-dogfood.example.yaml 片段手工合并
#   3. 重启 Studio / CLI 后再导入或 re-curate
#
# 完整手测说明见：
#   docs/acceptance-records/tpc-local-dogfood-GUIDE.md

mosaic:
  template_contract:
    # 打开后：混向倒排 / eligibility 求值器生效
    # 注意：不再自动解锁 experimental；W3 rail 须另开 template_experiments
    # （见 docs/config-mtso-experiments-dogfood.example.yaml）
    enabled: true
    # 仓库默认 false（AC-TPC-16）；手测观测请显式 true
    shadow_log: true
  # 可选：近景连拍硬拒绝（仓库默认 false · AC-TPC-15）
  # near_scene_clone_gate:
  #   enabled: true

features:
  gcs_poster_bric:
    # Studio 导出 ▾「单屏海报」；默认关时入口隐藏
    # 优先写 features 段（避免 studio 未知键告警）
    enabled: true
