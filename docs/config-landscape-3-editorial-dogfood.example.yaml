# Landscape-3 editorial — product default is ON (code defaults).
# Dual switch: landscape_3_editorial.enabled AND template_experiments.
# cohort ``*`` = all trips; omit this file unless overriding.

layout:
  landscape_3_editorial:
    enabled: true
    recent_window: 2
    repeat_penalty: 0.55
    strength_tie_epsilon: 0.08

mosaic:
  template_experiments:
    enabled: true
    allowlist:
      - screen-landscape-3-asymmetric-left
      - screen-landscape-3-asymmetric-right
      - screen-landscape-2-portrait-1
    cohort_trip_ids:
      - "*"
