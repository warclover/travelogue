# Mixed 1P2L dogfood — copy into local config.yaml (gitignore).
# Dual switch: mixed_1p2l.enabled AND template_experiments (allowlist + cohort_trip_ids).
# Fill remains GA screen-portrait-1-landscape-2 (not in allowlist).

layout:
  mixed_1p2l:
    enabled: true
    recent_window: 2
    repeat_penalty: 0.55
    strength_tie_epsilon: 0.08

mosaic:
  template_experiments:
    enabled: true
    allowlist:
      - screen-landscape-2-portrait-1
    cohort_trip_ids:
      - your-dogfood-trip-id
