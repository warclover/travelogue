# MEGC · 本机狗粮配置样例（默认勿开）

# 复制到本地 research/config 覆盖层；勿提交已开启的生产默认。
# 对应：docs/PRD-MOSAIC-EQUAL-GRID-CONTRACT-V1.md

mosaic:
  equal_grid_contract:
    enabled: true
    fix_stage_css: true
    selection_gate:
      enabled: true
      mode: soft_penalty   # soft_penalty | hard_reject
      allow_peaks: [sixteen_nine]
      allow_mixed_median_min: 1.70
      penalty: 8.0
    release_stage_on_narrow_peak: false
    page_letterbox: false
    patterns:
      - screen-landscape-4
      - screen-portrait-2-landscape-2
      - screen-mosaic-4-2l2p-weighted
