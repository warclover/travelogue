# Studio import stage hints (PRD §7.3 · F-STU-14)
stages:
  curate: "约 30 秒"
  narrate: "约 10 秒"
  render: "约 30 秒"
  longshot: "约 20–40 秒"
  llm_narrate: "约 30–60 秒"

# Per-step ingest duration (legacy · not shown in import UI)
ingest:
  - max_photos: 50
    hint: "约 30 秒"
  - max_photos: 100
    hint: "约 1 分钟"
  - max_photos: 250
    hint: "约 2 分钟"

# Full pipeline (ingest → curate → narrate → render) · single UI estimate
pipeline_estimates:
  - max_photos: 50
    hint: "约 3–5 分钟"
  - max_photos: 100
    hint: "约 5–8 分钟"
  - max_photos: 200
    hint: "约 8–15 分钟"
  - max_photos: 999999
    hint: "约 12–25 分钟"
